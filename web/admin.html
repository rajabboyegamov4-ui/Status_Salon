<meta charset="utf-8">
<title>Salon Boshqaruvi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: desktop salon front-desk board. Sidebar | (toolbar, stats, schedule grid with one column per master). Detail opens as a right drawer (bottom sheet on phones). */
:root {
  --bg: #f3f1ee;
  --panel: #ffffff;
  --sunken: #f7f5f2;
  --fg: #1d1a17;
  --muted: #74695f;
  --line: #e4ded6;
  --grid: #efeae4;
  --brass: #9a7433;
  --brass-soft: #f4ecdd;
  --brass-ink: #ffffff;
  --ok: #2f7a4f; --on-ok: #ffffff;
  --ok-soft: #e3f1e8;
  --bad: #b2412f;
  --bad-soft: #f8e5e1;
  --side: #1d1a17;
  --side-fg: #efe8df;
  --side-muted: #9c9186;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121010; --panel: #1b1816; --sunken: #171412; --fg: #f0e9e0; --muted: #a39789; --line: #2e2824; --grid: #241f1c;
    --brass: #d2ab66; --brass-soft: #2e2618; --brass-ink: #1a140f; --ok: #79c495; --on-ok: #10251a; --ok-soft: #1c2a21; --bad: #e88471; --bad-soft: #2f1d19;
    --side: #0c0a09; --side-fg: #efe8df; --side-muted: #8f8478; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121010; --panel: #1b1816; --sunken: #171412; --fg: #f0e9e0; --muted: #a39789; --line: #2e2824; --grid: #241f1c;
  --brass: #d2ab66; --brass-soft: #2e2618; --brass-ink: #1a140f; --ok: #79c495; --on-ok: #10251a; --ok-soft: #1c2a21; --bad: #e88471; --bad-soft: #2f1d19;
  --side: #0c0a09; --side-fg: #efe8df; --side-muted: #8f8478; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
aside { background: var(--side); color: var(--side-fg); padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.logo { font: 800 24px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.logo small { display: block; font: 600 10px/1.6 var(--body); letter-spacing: .16em; color: var(--side-muted); margin-top: 4px; }
.branch-pick { background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .1); border-radius: 10px; padding: 10px 12px; }
.branch-pick small { display: block; font-size: 11px; color: var(--side-muted); text-transform: uppercase; letter-spacing: .1em; }
.branch-pick b { font-weight: 700; }
.branch-pick select { display: block; width: 100%; background: transparent; border: 0; color: var(--side-fg); font-weight: 700; padding: 2px 0 0; cursor: pointer; }
.branch-pick option { color: #1d1a17; background: #fff; }
nav { display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 0; }
nav button { background: none; border: 0; color: var(--side-muted); text-align: left; padding: 10px 12px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
nav button[aria-current="page"] { background: rgb(255 255 255 / .08); color: var(--side-fg); }
nav button svg { flex: none; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.me .av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--brass); color: var(--brass-ink); display: grid; place-items: center; font-weight: 800; }
.me small { display: block; color: var(--side-muted); }
.me > span:not(.av) { min-width: 0; }
.me .demo { display: block; width: max-content; margin: 2px 0 0; }
.me .out { flex: none; }
.demo { font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--brass); border: 1px solid var(--brass); border-radius: 99px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }

.content { padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.toolbar h1 { font: 800 30px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; margin-right: auto; }
.toolbar h1 small { display: block; font: 600 12px/1.6 var(--body); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.daynav { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.daynav button { background: none; border: 0; padding: 8px 12px; font-weight: 700; }
.daynav button + button { border-left: 1px solid var(--line); }
.daynav input { border: 0; border-left: 1px solid var(--line); background: none; padding: 7px 10px; }
.primary { background: var(--brass); color: var(--brass-ink); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 800; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat { container-type: inline-size; }
.stat b { display: block; font: 800 28px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.stat b small { font-size: .7em; color: var(--muted); }
.stat.money b { font-size: clamp(18px, 6vw, 28px); font-size: clamp(18px, 19cqi, 28px); overflow-wrap: anywhere; }
.stat .bar { height: 4px; background: var(--grid); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: var(--brass); }

.board { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: auto; max-height: calc(100vh - 230px); min-height: 420px; }
.grid { display: grid; position: relative; min-width: max-content; }
.ghead { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.ghead.corner { left: 0; z-index: 4; }
.ghead .av { width: 32px; height: 32px; border-radius: 50%; background: var(--brass-soft); color: var(--brass); display: grid; place-items: center; font-weight: 800; flex: none; }
.ghead b { display: block; font-weight: 800; }
.ghead small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ghead > span:last-child { min-width: 0; }
.ghead.gone .av { background: var(--sunken); color: var(--muted); }
.times { position: sticky; left: 0; z-index: 2; background: var(--panel); border-right: 1px solid var(--line); }
.times span { position: absolute; right: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
.col { position: relative; border-right: 1px solid var(--grid); cursor: copy; }
.col:last-child { border-right: 0; }
.col.off { background: repeating-linear-gradient(135deg, var(--sunken) 0 8px, var(--panel) 8px 16px); cursor: default; }
.offhrs { position: absolute; left: 0; right: 0; pointer-events: none; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted) 13%, transparent) 0 6px, color-mix(in srgb, var(--muted) 5%, transparent) 6px 12px); }
.hline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); pointer-events: none; }
.hline.half { border-top-style: dashed; opacity: .7; }
.hover-slot { position: absolute; left: 4px; right: 4px; border: 1.5px dashed var(--brass); border-radius: 8px; color: var(--brass); font-size: 12px; font-weight: 700; padding: 2px 8px; pointer-events: none; }
.bk { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 5px 8px 5px 10px; text-align: left; overflow: hidden; cursor: pointer; z-index: 1;
  background: var(--brass-soft); border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); border-left: 4px solid var(--brass); display: flex; flex-direction: column; }
.bk:hover { filter: brightness(.97); }
.bk .t { font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bk .n { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk.tiny { flex-direction: row; gap: 6px; align-items: center; padding-block: 0; }
.bk.completed { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); border-left-color: var(--ok); }
.bk.no_show { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, transparent); border-left-color: var(--bad); }
.bk.cancelled { background: var(--sunken); border: 1px dashed var(--line); border-left: 4px solid var(--line); opacity: .75; }
.bk.cancelled .n { text-decoration: line-through; }
.bk.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--bad); z-index: 2; pointer-events: none; }
.now b { position: absolute; left: 4px; top: -10px; background: var(--bad); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 99px; font-variant-numeric: tabular-nums; }

.pill { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.confirmed, .pill.pending { background: var(--brass-soft); color: var(--brass); }
.pill.completed { background: var(--ok-soft); color: var(--ok); }
.pill.no_show { background: var(--bad-soft); color: var(--bad); }
.pill.cancelled { background: var(--sunken); color: var(--muted); }

.table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunken); }
td { padding: 11px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--sunken); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { padding: 40px; text-align: center; color: var(--muted); }

.drawer-scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .3); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--panel); z-index: 21; border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -10px 0 30px rgb(0 0 0 / .12); }
.drawer header { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
.drawer header h2 { margin: 0; font: 800 26px/1.05 var(--display); text-transform: uppercase; }
.drawer header small { color: var(--muted); }
.drawer .x { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; flex: none; }
.drawer .body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.drawer footer > .hint { grid-column: 1 / -1; margin: 0; text-align: center; }
.drawer footer { padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.when { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.when b { font: 800 38px/1 var(--display); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line); background: var(--sunken); border-radius: 6px; padding: 1px 8px; font-size: 12px; margin-left: 8px; }
.btn { border-radius: 10px; padding: 11px; font-weight: 800; border: 1px solid var(--line); background: var(--panel); }
a.btn { text-decoration: none; color: var(--fg); display: inline-block; }
a.btn.call { margin-left: 8px; padding: 2px 10px; font-size: 12px; border-radius: 6px; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.btn.bad { color: var(--bad); border-color: var(--bad); }
.btn.wide { grid-column: 1 / -1; }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.confirm { background: var(--bad-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; grid-column: 1 / -1; }
.confirm .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.field input[type="checkbox"] { width: auto; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sunken); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.notice { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; }
.hint { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 40; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700;
  display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / .18); }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; font-weight: 800; font-size: 13px; white-space: nowrap; flex: none; }
.warn { background: var(--brass-soft); color: var(--fg); border-left: 4px solid var(--brass); border-radius: 10px; padding: 10px 12px; font-weight: 700; }
body.ro .w { display: none !important; }
.login { max-width: 360px; margin: 10vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.login h1 { font: 800 30px/1 var(--display); text-transform: uppercase; margin: 0; }
.login .salon-name { color: var(--brass); font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.login input { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.demo-hint { background: var(--brass-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.out { background: none; border: 1px solid rgb(255 255 255 / .15); color: var(--side-muted); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; margin-left: auto; }
.role { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--sunken); color: var(--muted); }
.role.owner, .role.admin { background: var(--brass-soft); color: var(--brass); }
.off-row td { opacity: .5; }
.row-acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.row-acts .btn { padding: 6px 10px; font-size: 13px; }
.creds { background: var(--ok-soft); color: var(--fg); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.creds code { font: 800 18px var(--body); font-variant-numeric: tabular-nums; }
.pw-inline { display: flex; gap: 6px; }
.pw-inline input { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 140px; }
.sub-warn { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 14px; font-weight: 700; }

/* profile editor */
.psec { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.phd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.phd h3 { margin: 0; font: 800 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.pgrid .wide { grid-column: 1 / -1; }
.field textarea { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; resize: vertical; font: inherit; color: inherit; }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.prow .btn.primary { margin-left: auto; padding-inline: 22px; }
.prow a { color: var(--brass); font-weight: 700; font-size: 13px; }
.steps-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; color: var(--fg); }
.pcover { border-radius: 12px; overflow: hidden; background: var(--sunken); aspect-ratio: 20 / 9; max-height: 220px; max-width: 100%; display: grid; place-items: center; }
.pcover img { width: 100%; height: 100%; object-fit: cover; }
.pthumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.pthumb { position: relative; width: 88px; height: 88px; border-radius: 10px; overflow: hidden; background: var(--sunken); }
.pthumb img { width: 100%; height: 100%; object-fit: cover; }
.pdel { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .65); color: #fff; font-size: 12px; }
.pbtn { display: inline-grid; place-items: center; min-width: 88px; min-height: 40px; padding: 8px 12px; border: 1.5px dashed var(--line); border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; text-align: center; }
.pthumbs .pbtn { height: 88px; }
.pbtn:hover { border-color: var(--brass); color: var(--brass); }
.pmaster { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; }
.pface { display: flex; flex-direction: column; gap: 8px; }
.pface img, .pface > span { width: 150px; height: 150px; border-radius: 14px; object-fit: cover; background: var(--sunken); display: grid; place-items: center; font: 800 54px var(--display); color: var(--brass); }
.pbody { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.star { color: var(--brass); }
.previews { display: flex; flex-direction: column; gap: 10px; }
.prev { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.prev p { margin: 0; }
.prev.hidden-rv { opacity: .6; border-style: dashed; }
.ptop { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.ptop .star { font-size: 17px; letter-spacing: 1px; }
.pempty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); text-align: center; }
/* weekly hours, days off, services */
.hrows { display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: 34px 124px minmax(0, 1fr); align-items: center; gap: 8px 10px; padding: 8px 0; border-bottom: 1px solid var(--grid); min-height: 52px; }
.hrow:last-child { border-bottom: 0; }
.hrow > b { font-weight: 800; }
.hrow.is-off > b { color: var(--muted); }
.htimes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.htimes input { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 128px; font-variant-numeric: tabular-nums; }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
.sw input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--line); position: relative; margin: 0; cursor: pointer; flex: none; transition: background .15s; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.sw input:checked { background: var(--ok); }
.sw input:checked::after { transform: translateX(16px); }
.btn.mini { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.xlist { display: flex; flex-direction: column; }
.xh { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding-bottom: 6px; }
.xrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--grid); }
.xrow > .btn { margin-left: auto; }
.pill.k-day_off { background: var(--bad-soft); color: var(--bad); }
.pill.k-break { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.pill.k-extra { background: var(--ok-soft); color: var(--ok); }
.svc-list { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.svc { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--grid); background: none; text-align: left; width: 100%; }
.svc:last-child { border-bottom: 0; }
.svc:hover { background: var(--sunken); }

const parts = (d) => { const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value])); return { date: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute }; };
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const minOf = (iso) => parts(new Date(iso)).min;
const isoAt = (ymd, m) => `${ymd}T${hhmm(m)}:00+05:00`;

const dinfo = (ymd) => { const d = new Date(ymd + "T12:00:00+05:00"); return { wd: WEEK[d.getUTCDay()], wdf: WEEK_FULL[d.getUTCDay()], day: d.getUTCDate(), month: MONTHS[d.getUTCMonth()] }; };

// The salon comes from the address: /premium/admin -> "premium".
const SLUG = location.pathname.split("/").filter(Boolean)[0] || "";

// ---------- real API ----------
const NET_ERR = "Internet aloqasi yo'q. Qayta urinib ko'ring.", SRV_ERR = "Serverda xatolik, birozdan keyin urinib ko'ring", GONE = "Sessiya tugadi, qaytadan kiring";
const errText = (d) => (typeof d === "string" ? d : Array.isArray(d) && d[0]?.msg ? String(d[0].msg).replace(/^Value error, /, "") : "Xatolik yuz berdi");
const realApi = {
  async call(path, opts = {}) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    let res, body;
    try {
      res = await fetch(`/api/s/${SLUG}` + path, { ...opts, signal: ctl.signal, credentials: "same-origin", headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
      body = res.status === 204 ? null : await res.json().catch(() => undefined);
    } catch { throw new ApiError(0, NET_ERR); } finally { clearTimeout(timer); }
    if (res.status === 401 && path !== "/staff/login" && S.user) { sessionGone(); throw new ApiError(401, GONE); }
    if (res.status >= 500 || body === undefined) throw new ApiError(res.status, SRV_ERR);
    if (!res.ok) throw new ApiError(res.status, errText(body?.detail));

  },
  me() { return this.call("/staff/me").catch(() => null); },
  login(login, password) { return this.call("/staff/login", { method: "POST", body: JSON.stringify({ login, password }) }); },

  password(old_password, new_password) { return this.call("/staff/password", { method: "POST", body: JSON.stringify({ old_password, new_password }) }); },
  branches() { return this.call("/branches"); },
  masters(b) { return this.call(`/branches/${b}/masters`); },
  services(b) { return this.call(`/branches/${b}/services`); },
  day(b, d) { return this.call(`/staff/bookings?date=${d}${b ? "&branch_id=" + b : ""}`); },
  dayHours(b, d) { return this.call(`/staff/day-hours?branch_id=${b}&date=${d}`); },
  setStatus(id, status) { return this.call(`/staff/bookings/${id}`, { method: "PATCH", body: JSON.stringify({ status }) }); },
  // staff slots: no 30-minute lead, so a walk-in can sit down now
  slots(b, sids, d, m) { return this.call(`/staff/available-slots?branch_id=${b}&service_ids=${sids.join(",")}&date=${d}${m ? "&master_id=" + m : ""}`); },
  move(id, p) { return this.call(`/staff/bookings/${id}/move`, { method: "POST", body: JSON.stringify(p) }); },
  hours(mid) { return this.call(`/staff/masters/${mid}/hours`); },
  setHours(mid, days) { return this.call(`/staff/masters/${mid}/hours`, { method: "PUT", body: JSON.stringify({ days }) }); },
  exceptions(from, to) { return this.call(`/staff/exceptions?from=${from}&to=${to}`); },
  addException(p) { return this.call("/staff/exceptions", { method: "POST", body: JSON.stringify(p) }); },
  delException(id) { return this.call(`/staff/exceptions/${id}`, { method: "DELETE" }); },
  staffServices(b) { return this.call(`/staff/services?branch_id=${b}`); },
  addService(b, p) { return this.call(`/staff/services?branch_id=${b}`, { method: "POST", body: JSON.stringify(p) }); },
  updateService(b, id, p) { return this.call(`/staff/services/${id}?branch_id=${b}`, { method: "PATCH", body: JSON.stringify(p) }); },
  team() { return this.call("/staff/team"); },
  salonInfo() { return this.call(""); },
  updateSalon(p) { return this.call("/staff/salon", { method: "PATCH", body: JSON.stringify(p) }); },
  botState() { return this.call("/staff/telegram"); },
  botConnect(token) { return this.call("/staff/telegram", { method: "PUT", body: JSON.stringify({ token }) }); },
  botDisconnect() { return this.call("/staff/telegram", { method: "DELETE" }); },
  botUnlinkMe() { return this.call("/staff/telegram/me", { method: "DELETE" }); },

  updateMaster(id, p) { return this.call(`/staff/masters/${id}`, { method: "PATCH", body: JSON.stringify(p) }); },

  deletePhoto(id) { return this.call(`/staff/photos/${id}`, { method: "DELETE" }); },

};

  S.date = date; S.day = day; S.hours = hours; lastSync = Date.now(); render();
}
let toastTimer;

// Photos are shrunk in the browser before upload, so a phone picture of 5 MB becomes ~200 KB.
async function shrink(file, max) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("Rasmni o'qib bo'lmadi")); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

// "https://maps.google.com/?q=41.27,69.20", ".../@41.27,69.20,17z", yandex "?ll=69.20,41.27" -> {lat, lng}
function parseMapLink(text) {
  const t = decodeURIComponent(text || "");
  let m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&](?:q|query|daddr)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
  if (m) return { lat: +m[1], lng: +m[2] };
  m = t.match(/[?&](?:ll|pt)=(-?\d+\.\d+),(-?\d+\.\d+)/); // Yandex puts longitude first
  return m ? { lat: +m[2], lng: +m[1] } : null;
}

// Columns: active masters, plus any master who still has bookings this day but was switched off.
function boardCols() {
  if (!isAdmin()) return [{ id: null, name: S.user.name || "Mening jadvalim", rank: "" }];
  const have = new Set(S.masters.map((m) => m.id)), gone = [];
  for (const b of S.day) if (!have.has(b.master_id) && b.status !== "cancelled") { have.add(b.master_id); gone.push({ id: b.master_id, name: b.master_name, rank: "O'chirilgan", gone: true }); }
  return [...S.masters, ...gone];
}
// Working intervals of one master this day in minutes; null when the server gave no hours.
function ivs(mid) {
  if (!S.hours) return null;
  const r = mid == null ? S.hours[0] : S.hours.find((x) => x.master_id === mid);
  return r ? r.intervals.map(([a, b]) => [toMin(a), toMin(b)]) : null;
}
function setRange(cols) {
  let lo = Infinity, hi = -Infinity;
  for (const m of cols) for (const [a, b] of ivs(m.id) || []) { lo = Math.min(lo, a); hi = Math.max(hi, b); }
  for (const b of S.day) { const s = minOf(b.starts_at), e = minOf(b.ends_at); lo = Math.min(lo, s); hi = Math.max(hi, e > s ? e : 1440); }
  if (lo === Infinity) { lo = DEF_OPEN; hi = DEF_CLOSE; }
  OPEN = Math.floor(lo / 60) * 60; CLOSE = Math.max(OPEN + 120, Math.ceil(hi / 60) * 60);
}

function statsHtml() {
  const act = S.day.filter((b) => b.status !== "cancelled");
  const sum = (st) => act.filter((b) => st.includes(b.status)).reduce((a, b) => a + b.total_price, 0);
  const done = act.filter((b) => b.status === "completed").length, miss = act.filter((b) => b.status === "no_show").length;
  const cols = boardCols().filter((m) => !m.gone);
  let work = 0; for (const m of cols) { const iv = ivs(m.id); work += iv ? iv.reduce((a, [s, e]) => a + e - s, 0) : DEF_CLOSE - DEF_OPEN; }
  const busy = act.filter((b) => b.status !== "no_show").reduce((a, b) => a + (minOf(b.ends_at) - minOf(b.starts_at)), 0);
  const load = work ? Math.round((busy / work) * 100) : 0;
  return `<div class="stats">
    <div class="stat"><span>Bronlar</span><b>${act.length}</b></div>
    <div class="stat money"><span>Ishlandi, so'm</span><b>${som(sum(["completed"]))}</b></div>
    <div class="stat money"><span>Kutilmoqda, so'm</span><b>${som(sum(ACTIVE))}</b></div>
    <div class="stat"><span>Keldi / kelmadi</span><b>${done} <small>/ ${miss}</small></b></div>
    <div class="stat"><span>Bandlik</span><b>${load}%</b><div class="bar"><i style="width:${Math.min(load, 100)}%"></i></div></div></div>`;
}

function gridHtml() {
  const cols = boardCols(); setRange(cols);
  const H = (CLOSE - OPEN) * PX, y = (m) => (m - OPEN) * PX + 8;
  const isToday = S.date === today(), nowMin = parts(new Date()).min, past = S.date < today();
  let h = `<div class="board" id="board"><div class="grid" style="grid-template-columns:${TIMEW}px repeat(${cols.length}, minmax(${COLW}px, 1fr))">`;
  h += `<div class="ghead corner"></div>`;
  for (const m of cols) {
    const n = S.day.filter((b) => (m.id == null || b.master_id === m.id) && b.status !== "cancelled").length, iv = ivs(m.id);
    const sub = m.gone ? "O'chirilgan" : iv && !iv.length ? "Dam olish" : iv ? `${hhmm(iv[0][0])}–${hhmm(iv[iv.length - 1][1])}` : m.rank || "";
    h += `<div class="ghead${m.gone ? " gone" : ""}" title="${esc([m.rank, iv?.map(([a, b]) => `${hhmm(a)}–${hhmm(b)}`).join(", ")].filter(Boolean).join(" · "))}"><span class="av">${esc((m.name || "?")[0])}</span><span><b>${esc(m.name)}</b><small>${esc(sub)}${sub ? " · " : ""}${n} bron</small></span></div>`;
  }
  h += `<div class="times" style="height:${H + 16}px">`;
  for (let t = OPEN; t <= CLOSE; t += 60) h += `<span style="top:${y(t)}px">${hhmm(t)}</span>`;
  h += `</div>`;
  for (const m of cols) {
    const iv = ivs(m.id), off = past || m.gone || (iv && !iv.length) || ro();
    h += `<div class="col${off ? " off" : ""}" data-col="${m.id ?? ""}" style="height:${H + 16}px">`;
    if (iv && iv.length && !past && !m.gone) { // grey out the time this master does not work
      let from = OPEN;
      for (const [a, b] of [...iv, [CLOSE, CLOSE]]) { if (a > from) h += `<div class="offhrs" style="top:${from === OPEN ? 0 : y(from)}px;height:${y(a) - (from === OPEN ? 0 : y(from)) + (a === CLOSE ? 8 : 0)}px"></div>`; from = Math.max(from, b); }
    }
    for (let t = OPEN; t <= CLOSE; t += 30) h += `<div class="hline${t % 60 ? " half" : ""}" style="top:${y(t)}px"></div>`;
    for (const b of S.day.filter((x) => m.id == null || x.master_id === m.id)) {
      const s = minOf(b.starts_at), e = minOf(b.ends_at), hp = (e - s) * PX - 2, tiny = hp < 44;
      h += `<button class="bk ${b.status}${tiny ? " tiny" : ""}${S.open === b.id ? " sel" : ""}" data-b="${b.id}" style="top:${y(s) + 1}px;height:${hp}px" title="${hhmm(s)}–${hhmm(e)} ${bdi(who(b))}">
        <span class="t">${hhmm(s)}–${hhmm(e)}</span><span class="n">${bdi(who(b))}</span>${tiny ? "" : `<span class="s">${b.items.map((x) => esc(x.service_name)).join(", ")}</span>`}</button>`;
    }
    h += `</div>`;
  }
  if (isToday && nowMin > OPEN && nowMin < CLOSE) h += `<div class="now" style="top:${HEADH + y(nowMin)}px"><b>${hhmm(nowMin)}</b></div>`;
  return h + `</div></div>${ro() ? "" : `<p class="hint">Bo'sh joyni bosing: o'sha master va vaqtga yangi bron ochiladi. Chiziqli joylar: usta ishlamaydigan vaqt.</p>`}`;
}

function render() {
  const board = $("#board"), sx = board?.scrollLeft, sy = board?.scrollTop, nl = $("#nav")?.scrollLeft;
  document.body.classList.toggle("ro", ro());
  $("#root").innerHTML = S.user && S.branch ? shellHtml() : S.user ? "" : loginHtml();
  $("#layer").innerHTML = layerHtml();
  const nb = $("#board"); if (nb && sx != null) { nb.scrollLeft = sx; nb.scrollTop = sy; }
  const nav = $("#nav"), cur = $("#nav [aria-current=page]");
  if (nav && nav.scrollWidth > nav.clientWidth) { // keep the tab strip where it was, but the current tab in view
    nav.scrollLeft = nl || 0;
    if (cur && (cur.offsetLeft < nav.scrollLeft || cur.offsetLeft + cur.offsetWidth > nav.scrollLeft + nav.clientWidth)) nav.scrollLeft = cur.offsetLeft - 16;
  }
}

async function openForm(master, startMin) {
  S.error = ""; S.open = null; S.form = { key: uuid(), name: "", phone: "", master: master ?? S.masters[0]?.id, sids: S.services[0] ? [S.services[0].id] : [], slots: [], slot: null, want: startMin, loading: true };
  render(); await refreshSlots();
}
async function refreshSlots() {
  const F = S.form; F.loading = true;
  try { F.slots = F.sids.length && F.master ? (await api.slots(S.branch.id, F.sids, S.date, F.master)).slots : []; }
  catch (e) { F.slots = []; F.slot = null; throw e; } finally { F.loading = false; }
  const want = F.want != null ? F.slots.find((x) => minOf(x.start) >= F.want) : null;
  F.slot = (want || F.slots[0] || {}).start || null; render();
}
async function refreshMoveSlots() {

}

    else if (d.pw) { S.pwFor = +d.pw; S.pw = newPassword(); S.creds = null; render(); }
    else if (d.pwcancel) { S.pwFor = null; render(); }
    else if (d.pwsave) {

      S.creds = { name: m.name, login: m.login, password: S.pw, role: m.role }; S.pwFor = null; await loadTeam(); toast("Parol yangilandi");
    }
    else if (d.mypw) {

      if (!P.old) throw new Error("Hozirgi parolni yozing");

    }

        const days = await Promise.all(Array.from({ length: 14 }, (_, i) => api.day(null, addDays(today(), i))));
        const n = days.flat().filter((b) => b.master_id === m.master_id && ACTIVE.includes(b.status) && Date.parse(b.ends_at) > Date.now()).length;
        if (n) { S.offAsk = { id: m.id, name: m.name, n }; S.creds = null; return render(); }
      }
      await api.updateMember(m.id, { is_active: !m.is_active }); S.creds = null; S.offAsk = null;

    }

    else if (d.fm) { S.form.master = +d.fm; await refreshSlots(); }

    else if (d.mvback) { S.move = null; render(); }
    else if (d.mvm) { S.move.master = +d.mvm; await refreshMoveSlots(); }
    else if (t.id === "mvsave") {
      const M = S.move; M.busy = true; render();

      try { upd = await api.move(M.b.id, { starts_at: M.slot, ...(M.master !== M.b.master_id ? { master_id: M.master } : {}) }); }
      catch (err) { M.busy = false; if (err.status === 409) await refreshMoveSlots().catch(() => {}); throw err; }

    else if (d.hall) { const r = S.sched.rows[+d.hall]; for (const x of S.sched.rows) if (x.on) { x.from = r.from; x.to = r.to; x.multi = false; } render(); toast("Vaqt ishlaydigan barcha kunlarga qo'yildi"); }
    else if (d.hsave) {
      const H = S.sched, days = [];
      H.rows.forEach((r, w) => { if (!r.on) return; if (!r.from || !r.to || r.to <= r.from) throw new Error(`${WD_FULL[w]}: tugash vaqti boshlanishidan keyin bo'lsin`); days.push({ weekday: w, start: r.from, end: r.to }); });
      await api.setHours(H.mid, days); await loadHours(H.mid);
      S.hours = await api.dayHours(S.branch.id, S.date).catch(() => S.hours);
      toast(`${S.masters.find((m) => m.id === H.mid)?.name || "Usta"}: ish vaqti saqlandi`);
    }
    // days off and breaks
    else if (d.xkind) { S.excForm.kind = d.xkind; render(); }
    else if (d.xadd) {
      const X = S.excForm;
      if (!X.date) throw new Error("Sanani tanlang");
      if (X.kind !== "day_off" && (!X.from || !X.to || X.to <= X.from)) throw new Error("Boshlanish va tugash vaqtini to'g'ri kiriting");
      const r = await api.addException({ master_id: X.mid, date: X.date, kind: X.kind, ...(X.kind === "day_off" ? {} : { start: X.from, end: X.to }), note: X.note.trim() });
      X.note = ""; S.warn = r.conflicts ? `${r.conflicts} ta bron shu vaqtga to'g'ri keladi, mijozlarga qo'ng'iroq qiling` : "";
      if (r.date === S.date) S.hours = await api.dayHours(S.branch.id, S.date).catch(() => S.hours);
      await loadExc(); toast(`${KIND[r.kind]} qo'shildi`);
    }
    else if (d.xdel) {
      const x = S.exc.find((y) => y.id === +d.xdel); await api.delException(+d.xdel); S.warn = "";
      if (x?.date === S.date) S.hours = await api.dayHours(S.branch.id, S.date).catch(() => S.hours);

    }
    // services
    else if (t.id === "sadd") openSvcForm(null);
    else if (d.sedit) openSvcForm(S.svcs.find((s) => s.id === +d.sedit));
    else if (t.id === "sfsave") {

      S.svcForm = null;

  if (id === "mp-old") S.myPw.old = v; if (id === "mp-new") S.myPw.nw = v;
  if (id === "fname") S.form.name = v;
  if (id === "fphone") { S.form.phone = v; const b = $("#fsave"), dg = digitsOf(v); if (b) b.disabled = !(S.form.slot && !S.form.busy && (!dg || dg.length >= 9)); }
  if (id === "fslot") S.form.slot = v;
  if (id === "mvslot") S.move.slot = v;
  if (dd.hfrom) S.sched.rows[+dd.hfrom].from = v;
  if (dd.hto) S.sched.rows[+dd.hto].to = v;
  if (id === "x-from") S.excForm.from = v; if (id === "x-to") S.excForm.to = v; if (id === "x-note") S.excForm.note = v; if (id === "x-date") S.excForm.date = v;
  if (id === "sf-name") S.svcForm.name = v; if (id === "sf-cat") S.svcForm.cat = v; if (id === "sf-dur") S.svcForm.dur = v;
  if (id === "sf-price") S.svcForm.price = priceInput(el);
  if (dd.sfp) S.svcForm.masters[+dd.sfp].price = priceInput(el);
});
document.addEventListener("change", async (e) => {
  const el = e.target, dd = el.dataset;
  try {
    if (el.id === "pick" && el.value) { S.error = ""; await loadDay(el.value); }
    else if (el.id === "branch") {
      S.branch = S.branches.find((b) => b.id === +el.value); try { localStorage.setItem("admin.branch", S.branch.id); } catch {}
      closeLayers(); await loadBranch(); if (S.view !== "grid" && S.view !== "list") await enterView(S.view);
    }
    else if (el.id === "mvdate" && el.value) { S.move.date = el.value; S.error = ""; await refreshMoveSlots(); }
    else if (dd.hon) { const r = S.sched.rows[+dd.hon]; r.on = el.checked; render(); }
    else if (el.id === "x-master") S.excForm.mid = +el.value;
    else if (el.id === "x-date") S.excForm.date = el.value;
    else if (el.id === "sf-active") { S.svcForm.active = el.checked; render(); }
    else if (dd.sfm) { S.svcForm.masters[+dd.sfm].on = el.checked; render(); }
    else if (dd.upload) { S.error = ""; await onProfileUpload(el); }
  } catch (err) { S.error = err.message; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && layerOpen()) { closeLayers(); render(); } });

// Board refresh: every 20 seconds while the tab is visible and on focus, never while a drawer or form is open.
async function autoRefresh() {
  if (document.visibilityState !== "visible" || !S.user || !S.branch || BUSY || !["grid", "list"].includes(S.view) || layerOpen() || Date.now() - lastSync < 10000) return;
  const date = S.date, seen = new Set(S.day.map((b) => b.id));
  lastSync = Date.now();
  try {
    const [day, hours] = await Promise.all([api.day(S.branch.id, date), api.dayHours(S.branch.id, date).catch(() => S.hours)]);
    if (date !== S.date || BUSY || layerOpen() || !S.user) return;
    S.day = day; S.hours = hours; render();
    const fresh = day.filter((b) => !seen.has(b.id) && ACTIVE.includes(b.status)).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
    if (fresh.length) toast(`Yangi bron: ${hhmm(minOf(fresh[0].starts_at))} \u2068${who(fresh[0])}\u2069 (\u2068${fresh[0].master_name}\u2069)${fresh.length > 1 ? `, yana ${fresh.length - 1} ta` : ""}`);
  } catch { /* quiet: the next minute tries again */ }
}
setInterval(autoRefresh, 20000);
window.addEventListener("focus", autoRefresh);
// Back from Telegram after pressing Start: the notice switch turns on by itself.
window.addEventListener("focus", () => {
  if (!S.user || !S.bot?.connected || S.bot.me_linked) return;
  api.botState().then((b) => { if (b?.me_linked) { S.bot = b; toast("Xabarlar yoqildi ✅"); render(); } }).catch(() => {});
});
document.addEventListener("visibilitychange", autoRefresh);

async function loadBranch() {
  [S.masters, S.services] = await Promise.all([api.masters(S.branch.id), api.services(S.branch.id)]);
  S.svcs = null; S.sched = null; S.exc = null; S.excForm = null;
  await loadDay();
}
async function boot() {
  if (!S.user) return render();
  S.branches = await api.branches();
  let saved = null; try { saved = +localStorage.getItem("admin.branch"); } catch {}
  S.branch = S.branches.find((b) => b.id === S.user.branch_id) || S.branches.find((b) => b.id === saved) || S.branches[0];
  if (!S.branch) { S.user = null; S.error = "Salonda filial yo'q. Platforma bilan bog'laning."; return render(); }
  await loadBranch(); scrollToNow();
}
(async () => {
  try {
    const r = await fetch("/api/health"); if (!r.ok || !(await r.json()).ok) throw 0;
    const info = await fetch(`/api/s/${SLUG}`).then((x) => (x.ok ? x.json() : null)).catch(() => null);
    if (!info) { S.error = "Salon topilmadi. Manzilni tekshiring."; return render(); }
    S.salonName = info.name; S.user = await realApi.me();
  }
  catch { S.demo = true; api = demoApi; S.salonName = DEMO_SALON.name; S.user = await api.me(); }
  try { await boot(); } catch (err) { S.error = err.message; if (!S.branch) S.user = null; render(); }
})();
</script>
