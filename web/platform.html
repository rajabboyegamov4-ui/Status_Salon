<style>
/* Layout: the team's desk. Header with who is signed in, counters, tabs (Lidlar, Bizneslar, To'lovlar, Jamoa), one card or row per item, drawers for forms. */
:root {
  --bg: #f3f1ee; --panel: #ffffff; --sunken: #f7f5f2; --fg: #1d1a17; --muted: #74695f; --line: #e4ded6;
  --brass: #9a7433; --brass-soft: #f4ecdd; --brass-ink: #ffffff; --ok: #2f7a4f; --on-ok: #ffffff; --ok-soft: #e3f1e8; --bad: #b2412f; --bad-soft: #f8e5e1;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121010; --panel: #1c1917; --sunken: #231f1c; --fg: #f0e9e0; --muted: #a39789; --line: #2f2925;
    --brass: #d2ab66; --brass-soft: #2e2618; --brass-ink: #1a140f; --ok: #79c495; --on-ok: #10251a; --ok-soft: #1c2a21; --bad: #e88471; --bad-soft: #2f1d19;
    --warn: #e2b660; --warn-soft: #2d2414; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121010; --panel: #1c1917; --sunken: #231f1c; --fg: #f0e9e0; --muted: #a39789; --line: #2f2925;
  --brass: #d2ab66; --brass-soft: #2e2618; --brass-ink: #1a140f; --ok: #79c495; --on-ok: #10251a; --ok-soft: #1c2a21; --bad: #e88471; --bad-soft: #2f1d19;
  --warn: #e2b660; --warn-soft: #2d2414; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

select, textarea { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; font: inherit; color: inherit; }

  box-shadow: 0 12px 32px rgb(0 0 0 / .16); min-width: 220px; padding: 6px; display: grid; gap: 2px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 7px 12px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const bdi = (s) => "⁨" + esc(s) + "⁩";
const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tashkent" }).format(new Date());
const dayDiff = (ymd) => Math.round((new Date(ymd + "T00:00:00Z") - new Date(today() + "T00:00:00Z")) / 86400e3);
const fmtDate = (ymd) => { const [y, m, d] = ymd.split("-").map(Number); return `${d}-${MONTHS[m - 1]}${y !== +today().slice(0, 4) ? " " + y : ""}`; };
const som = (n) => Number(n || 0).toLocaleString("ru-RU").replace(/\s/g, " ") + " so'm";
const newPassword = () => { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let p = ""; for (let i = 0; i < 10; i++) p += a[Math.floor(Math.random() * a.length)]; return p; };
const slugify = (s) => s.toLowerCase().replace(/[ʻʼ'`]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const digits = (s) => String(s || "").replace(/\D/g, "");
class ApiError extends Error { constructor(s, m) { super(m); this.status = s; } }

const KINDS = [["shop", "Buyurtma (gul, tort, do'kon)"], ["beauty", "Ayollar saloni"], ["barber", "Barbershop"], ["cosmetology", "Kosmetologiya"], ["dental", "Stomatologiya"], ["clinic", "Klinika"], ["spa", "SPA va massaj"], ["auto", "Avtoservis"], ["vet", "Veterinariya"], ["other", "Boshqa"]];
const kindLabel = (k) => (KINDS.find((x) => x[0] === k) || ["", "Boshqa"])[1];
const STATUSES = [["new", "Yangi"], ["talked", "Gaplashildi"], ["demo", "Demo"], ["trial", "Sinovda"], ["paid", "To'ladi"], ["later", "Keyinroq"], ["lost", "Rad etdi"]];
const OPEN_ST = ["new", "talked", "demo", "trial"];
const SIZES = [["small", "Kichik"], ["medium", "O'rta"], ["large", "Yirik"]];
const SOURCES = ["2GIS", "Yandex xarita", "Google Maps", "Instagram", "Telegram", "Tanish orqali", "Yurib topildi", "Boshqa"];
const HOW_NOW = ["Daftar", "Excel / Sheets", "Telegram chat", "Telefon orqali", "Boshqa tizim", "Noma'lum"];
const NOTE_KINDS = [["call", "Qo'ng'iroq"], ["meeting", "Uchrashuv"], ["message", "Xabar"], ["demo", "Demo"]];
const sizeLabel = (k) => (SIZES.find((x) => x[0] === k) || ["", ""])[1];
const stLabel = (k) => (STATUSES.find((x) => x[0] === k) || ["", k])[1];
const ROLE = { owner: "Ega", partner: "Sherik", sales: "Sotuvchi" };
// The presentation page set up for a business: its kind, its name and its live demo bot.
const showUrl = (s) => ((s.modules || ["booking"]).includes("booking")
  ? `/taqdimot?soha=${encodeURIComponent(s.kind || "other")}&nom=${encodeURIComponent(s.name)}&demo=${encodeURIComponent(s.slug)}` : `/${encodeURIComponent(s.slug)}/shop`);
const MODS = { booking: "Bron", orders: "Buyurtma" };

const api = {
  async call(path, opts = {}) {
    let res;
    try { res = await fetch("/api/platform" + path, { ...opts, credentials: "same-origin", headers: { "Content-Type": "application/json", ...(opts.headers || {}) } }); }
    catch { throw new ApiError(0, "Internet aloqasi yo'q. Qayta urinib ko'ring."); }
    if (res.status === 204) return null;
    const body = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "/login" && path !== "/me") { S.me = null; render(); }
    if (!res.ok) throw new ApiError(res.status, typeof body.detail === "string" ? body.detail : Array.isArray(body.detail) ? "Maydonlarni tekshiring: " + (body.detail[0]?.msg || "").replace(/^Value error, /, "") : "Xatolik yuz berdi");
    return body;
  },
  get(p) { return this.call(p); },
  post(p, b) { return this.call(p, { method: "POST", body: JSON.stringify(b) }); },
  patch(p, b) { return this.call(p, { method: "PATCH", body: JSON.stringify(b) }); },
  put(p, b) { return this.call(p, { method: "PUT", body: JSON.stringify(b) }); },
};

const S = { me: null, tab: "leads", leads: [], salons: [], team: [], payments: [], stats: {}, filter: "open", q: "", drawer: null, creds: null, error: "", login: { login: "", password: "" }, ask: null, busy: false,
  view: (() => { try { return localStorage.getItem("crm-view") || "list"; } catch { return "list"; } })(), fkind: "", fwho: "" };
const manager = () => ["owner", "partner"].includes(S.me?.role);
function toast(msg) { $("#toast-slot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => { $("#toast-slot").innerHTML = ""; }, 2600); }

async function load() {
  const [leads, salons, team, stats] = await Promise.all([api.get("/leads"), api.get("/salons"), api.get("/team"), api.get("/stats")]);
  Object.assign(S, { leads, salons, team, stats });
  if (manager() && S.tab === "money") S.payments = await api.get("/payments");
  render();
}
async function refreshStats() { S.stats = await api.get("/stats").catch(() => S.stats); }

// ---------- leads ----------
const isDue = (l) => l.next_step_on && dayDiff(l.next_step_on) <= 0 && !["paid", "lost"].includes(l.status);
const whenHtml = (l) => { const d = l.next_step_on ? dayDiff(l.next_step_on) : null; return d === null ? "" : d < 0 ? `<b>${-d} kun kechikdi</b>` : d === 0 ? "<b>bugun</b>" : d === 1 ? "ertaga" : fmtDate(l.next_step_on); };
function leadHtml(l) {
  const when = whenHtml(l);
  const salon = l.salon_id ? S.salons.find((s) => s.id === l.salon_id) : null;
  const tel = digits(l.phone);
  return `<article class="lead${isDue(l) ? " due" : ""}">
    <div><h3><button data-ledit="${l.id}">${bdi(l.name)}</button></h3>
      <div class="meta"><span>${esc(kindLabel(l.kind))}${l.size ? ` · ${esc(sizeLabel(l.size))}` : ""}${l.staff_count ? ` · ${l.staff_count} xodim` : ""}</span>${l.contact ? `<span>${bdi(l.contact)}</span>` : ""}${l.phone ? `<a href="tel:+${tel}">⁦${esc(l.phone)}⁩</a>` : ""}${l.district ? `<span>${bdi(l.district)}</span>` : ""}${l.address ? `<span>${bdi(l.address)}</span>` : ""}${manager() ? `<span>· ${esc(l.assigned_name || "Ega")}</span>` : ""}</div>
      ${l.next_step || when ? `<div class="next">Keyingi qadam: ${bdi(l.next_step || "—")}${when ? ` · ${when}` : ""}</div>` : ""}
      ${l.notes_count ? `<div class="talk">💬 ${l.notes_count} ta suhbat · oxirgisi ${fmtDate(l.last_note_on)}</div>` : ""}</div>
    <div class="side"><select class="mini" data-lstatus="${l.id}" aria-label="Holat">${STATUSES.filter(([k]) => k !== "paid" || manager() || l.status === "paid").map(([k, v]) => `<option value="${k}"${k === l.status ? " selected" : ""}>${v}</option>`).join("")}</select></div>
    ${l.status === "lost" && l.lost_reason ? `<div class="lost">Sababi: ${bdi(l.lost_reason)}</div>` : ""}
    ${l.note ? `<div class="note">${bdi(l.note)}</div>` : ""}
    <div class="acts">
      ${salon ? `<a class="btn link main" href="${esc(showUrl(salon))}" target="_blank" rel="noopener">Taqdimot</a>` : `<button class="btn primary main" style="font-size:13px;padding:7px 11px" data-demo="${l.id}">Demo ochish</button>`}
      <button class="btn" data-notes="${l.id}">${l.notes_count ? `Suhbatlar (${l.notes_count})` : "Suhbat"}</button>
      ${tel ? `<a class="btn link" href="tel:+${tel}" aria-label="Qo'ng'iroq">📞</a>` : ""}
      ${moreMenu("l" + l.id, [
        ["Tahrirlash", `data-ledit="${l.id}"`],
        tel && ["📞 Qo'ng'iroq qilish", `href="tel:+${tel}"`],
        salon && ["Admin panel", `href="/${esc(salon.slug)}/admin" target="_blank" rel="noopener"`],
        salon && !salon.telegram_bot && ["Bot ulash", `data-takebot="${salon.id}"`],
      ])}
    </div></article>`;
}
function kanbanHtml(list) {
  const cols = STATUSES.filter(([k]) => S.filter === "all" || S.filter === "due" || S.filter === k || (S.filter === "open" && OPEN_ST.includes(k)));
  return `<div class="kanban">${cols.map(([k, v]) => { const items = list.filter((l) => l.status === k);
    return `<section class="kcol"><h3><span class="pill st-${k}">${v}</span><span class="hint">${items.length}</span></h3>${items.map((l) => `<button class="kcard${isDue(l) ? " due" : ""}" data-ledit="${l.id}"><b>${bdi(l.name)}</b>
      <span>${esc(kindLabel(l.kind))}${l.district ? ` · ${bdi(l.district)}` : ""}</span>${l.next_step || l.next_step_on ? `<span>${bdi(l.next_step || "—")}${l.next_step_on ? ` · ${whenHtml(l)}` : ""}</span>` : ""}
      ${manager() ? `<span>${esc(l.assigned_name || "Ega")}</span>` : ""}</button>`).join("") || `<span class="hint">—</span>`}</section>`; }).join("")}</div>`;
}
function leadsList() {
  const q = S.q.trim().toLowerCase();
  const pass = (l) => (S.filter === "all" || (S.filter === "open" && OPEN_ST.includes(l.status)) || (S.filter === "due" && isDue(l)) || l.status === S.filter)
    && (!S.fkind || l.kind === S.fkind) && (!S.fwho || (S.fwho === "owner" ? !l.assigned_to : l.assigned_to === +S.fwho))
    && (!q || [l.name, l.district, l.address, l.contact].join(" ").toLowerCase().includes(q) || digits(l.phone).includes(digits(q) || "§"));
  return S.leads.filter(pass).sort((a, b) => (isDue(b) - isDue(a)) || String(a.next_step_on || "9").localeCompare(String(b.next_step_on || "9")));
}
function leadsHtml() {
  const list = leadsList();
  const chip = (k, label) => `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${label}</button>`;
  return `<div class="filters"><div class="chips">${chip("open", "Ochiq")}${chip("due", "Bugun qilinadigan")}${STATUSES.map(([k, v]) => chip(k, v)).join("")}${chip("all", "Hammasi")}</div></div>
    <div class="tools">
      <input class="search" id="q" placeholder="Nom, tuman yoki telefon" value="${esc(S.q)}" autocomplete="off">
      <select id="fkind" aria-label="Soha"><option value="">Barcha sohalar</option>${KINDS.map(([k, v]) => `<option value="${k}"${S.fkind === k ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
      ${manager() ? `<select id="fwho" aria-label="Mas'ul"><option value="">Hamma mas'ullar</option><option value="owner"${S.fwho === "owner" ? " selected" : ""}>Ega</option>${S.team.map((u) => `<option value="${u.id}"${S.fwho === String(u.id) ? " selected" : ""}>${esc(u.name)}</option>`).join("")}</select>` : ""}
      <div class="seg"><button data-view="list" aria-pressed="${S.view === "list"}">Ro'yxat</button><button data-view="board" aria-pressed="${S.view === "board"}">Bosqichlar</button></div>
      <span class="io-group"><span class="hint count">${list.length} ta</span>
      <label class="btn io" for="imp" style="cursor:pointer">Import (CSV)</label><input type="file" id="imp" accept=".csv,text/csv,.txt" hidden>
      <button class="btn io" data-export="1">Eksport</button></span></div>
    ${!list.length ? `<div class="table-wrap"><div class="empty">${S.leads.length ? "Bu filtrda lid yo'q." : "Hali lid yo'q. Birinchi biznesni \"+ Lid\" bilan qo'shing yoki xaritadan yig'ilgan ro'yxatni \"Import\" bilan yuklang."}</div></div>`
      : S.view === "board" ? kanbanHtml(list) : `<div class="leads">${list.map(leadHtml).join("")}</div>`}`;
}

// ---------- businesses ----------
const state = (s) => s.is_demo ? "demo" : !s.is_active ? "off" : dayDiff(s.paid_until) < 0 ? "bad" : dayDiff(s.paid_until) <= 7 ? "soon" : "ok";
const STATE = { ok: ["ok", "Faol"], soon: ["soon", "Tugayapti"], bad: ["bad", "Muddati o'tgan"], off: ["off", "To'xtatilgan"], demo: ["soon", "Demo"] };
// The "⋯" button and its list; items are [label, attributes] (href makes it a link), false items are skipped, "-" is a divider.
function moreMenu(key, items) {
  const list = items.filter(Boolean);
  if (!list.length) return "";
  return `<div class="more-wrap"><button class="btn more" data-menu="${key}" aria-label="Boshqa amallar" aria-expanded="${S.menu === key}">⋯</button>
    ${S.menu === key ? `<div class="menu" role="menu">${list.map((x) => x === "-" ? "<hr>" : x[1].includes("href=")
      ? `<a role="menuitem" ${x[1]}${x[2] ? ` class="${x[2]}"` : ""}>${x[0]}</a>` : `<button role="menuitem" ${x[1]}${x[2] ? ` class="${x[2]}"` : ""}>${x[0]}</button>`).join("")}</div>` : ""}</div>`;
}
function salonCard(s) {
  const st = state(s), dd = dayDiff(s.paid_until);
  const left = !s.is_active ? "to'xtatilgan" : dd < 0 ? `${-dd} kun oldin tugagan` : dd === 0 ? "bugun oxirgi kun" : `${dd} kun qoldi`;
  // The one thing to do next sits on the card: a bot first, then money; everything else is in the menu.
  const main = !s.telegram_bot ? `<button class="btn primary main" style="font-size:13px;padding:7px 11px" data-takebot="${s.id}">Bot ulash</button>`
    : manager() ? `<button class="btn pay main" data-pay="${s.id}">To'lov</button>` : `<a class="btn link main" href="${esc(showUrl(s))}" target="_blank" rel="noopener">Taqdimot</a>`;
  const acts = S.ask === s.id
    ? `<div class="confirm"><span class="hint">To'xtatilsinmi? Mijozlari bron qila olmaydi.</span><button class="btn" data-keep="1">Yo'q</button><button class="btn bad" data-stop="${s.id}">Ha, to'xtatish</button></div>`
    : `${main}${moreMenu("s" + s.id, [
        (s.telegram_bot) && ["Taqdimot", `href="${esc(showUrl(s))}" target="_blank" rel="noopener"`],
        ["Admin panel", `href="/${esc(s.slug)}/admin" target="_blank" rel="noopener"`],
        manager() && !s.telegram_bot && ["To'lov yozish", `data-pay="${s.id}"`],
        manager() && ["Modullar", `data-mods="${s.id}"`],
        manager() && !s.paid_total && [s.is_demo ? "Demo emas (oddiy mijoz)" : "Demo qilish", `data-setdemo="${s.id}"`],
        manager() && "-",
        manager() && (s.is_active ? ["To'xtatish", `data-ask="${s.id}"`, "bad"] : ["Yoqish", `data-resume="${s.id}"`]),
      ])}`;
  return `<article class="biz${st === "bad" || st === "soon" && !s.is_demo ? " warn" : ""}">
    <div><h3>${bdi(s.name)}</h3>
      <div class="sub"><a href="/${esc(s.slug)}/admin" target="_blank" rel="noopener">/${esc(s.slug)}</a><span>${esc(kindLabel(s.kind))} · ${(s.modules || ["booking"]).map((m) => MODS[m] || m).join(" + ")}</span>
        <span>${s.telegram_bot ? `@${esc(s.telegram_bot)}` : "bot yo'q"}</span><span class="num">${s.staff_count} xodim · ${s.bookings_30d} bron / 30 kun${manager() && s.paid_total ? ` · ${som(s.paid_total)}` : ""}</span></div></div>
    <div class="term"><span class="pill ${STATE[st][0]}">${STATE[st][1]}</span><span class="num">${fmtDate(s.paid_until)}</span><span class="days">${left}</span></div>
    <div class="acts">${acts}</div></article>`;
}
function salonsHtml() {
  const q = S.q.trim().toLowerCase();
  const list = S.salons.filter((s) => !q || s.name.toLowerCase().includes(q) || s.slug.includes(q));
  return `<div class="filters"><span class="hint">Demolar 14 kunlik sinov bilan ochiladi. To'lov yozilgach demo oddiy mijozga aylanadi va boti unda qoladi.</span><input class="search" id="q" placeholder="Qidirish" value="${esc(S.q)}" autocomplete="off"></div>
    ${list.length ? `<div class="biz-list">${list.map(salonCard).join("")}</div>` : `<div class="table-wrap"><div class="empty">Biznes yo'q.</div></div>`}`;
}

// ---------- money ----------
function moneyHtml() {
  return `<div class="table-wrap">${S.payments.length ? `<table><thead><tr><th>Sana</th><th>Biznes</th><th>Oy</th><th>Summa</th></tr></thead><tbody>${S.payments.map((p) => `<tr><td class="num">${fmtDate(p.paid_at.slice(0, 10))}</td><td>${bdi(p.salon_name)}</td><td class="num">${p.months}</td><td class="num"><b>${som(p.amount)}</b></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Hali to'lov yozilmagan. "Bizneslar" bo'limida "To'lov" tugmasi bilan yoziladi.</div>`}</div>`;
}

// ---------- team ----------

  return `<div class="filters"><span class="hint">Har kim o'z login-paroli bilan kiradi. Sotuvchi faqat o'z lidlarini ko'radi, demo ochadi va pulni ko'rmaydi. Sherik hamma narsani ko'radi.</span></div>
  <div class="table-wrap"><table><thead><tr><th>Ism</th><th>Login</th><th>Rol</th><th>Oxirgi kirish</th><th></th></tr></thead><tbody>
  <tr><td><b>${esc(S.me.role === "owner" && S.me.id === null ? S.me.name : "Platforma egasi")}</b></td><td class="hint">asosiy</td><td>Ega</td><td></td><td></td></tr>
  ${S.team.map((u) => `<tr><td><b>${bdi(u.name)}</b>${u.is_active ? "" : ' <span class="pill off">o\'chirilgan</span>'}</td><td class="num">${esc(u.login)}</td><td>${ROLE[u.role]}</td><td class="num">${u.last_login_at ? fmtDate(u.last_login_at.slice(0, 10)) : "—"}</td>
    <td class="c-acts"><div class="acts">${manager() && (u.role === "sales" || S.me.role === "owner") ? `<button class="btn" data-newpw="${u.id}">Yangi parol</button><button class="btn${u.is_active ? " bad" : ""}" data-toggleu="${u.id}">${u.is_active ? "O'chirish" : "Yoqish"}</button>` : ""}</div></td></tr>`).join("")}
  </tbody></table></div>`;
}

// ---------- page ----------
function statsHtml() {
  const st = S.stats, L = st.leads || {}, open = ["new", "talked", "demo", "trial"].reduce((a, k) => a + (L[k] || 0), 0);
  const cards = manager()
    ? [["To'layotgan bizneslar", st.paying ?? 0], ["Tushum, 30 kun", som(st.income_30d)], ["Ochiq lidlar", open], ["Bugun qilinadigan", st.due_today ?? 0]]
    : [["Mening ochiq lidlarim", open], ["Demo va sinovda", (L.demo || 0) + (L.trial || 0)], ["To'lovga o'tganlar", L.paid || 0], ["Bugun qilinadigan", st.due_today ?? 0]];
  const goal = manager() ? (st.goal
    ? `<div class="goal"><div><span class="hint">Maqsad: ${som(st.goal)} · yig'ildi ${som(st.income_total)}</span><b>${st.income_total >= st.goal ? "Maqsadga yetdingiz 🎉" : `${som(st.goal - st.income_total)} qoldi`}</b></div>
        <button class="btn" data-goal="1">O'zgartirish</button><div class="bar"><i style="width:${Math.min(100, Math.round((st.income_total || 0) / st.goal * 100))}%"></i></div></div>`
    : `<div class="filters"><button class="btn" data-goal="1">+ Pul maqsadi qo'yish</button><span class="hint">Masalan, birinchi 3 oyda qancha yig'moqchisiz: bosh sahifada qancha qolgani ko'rinib turadi.</span></div>`) : "";
  return `<div class="stats">${cards.map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("")}</div>${goal}`;
}
function mainHtml() {
  const tabs = [["leads", "Lidlar", S.stats.due_today || 0], ["salons", "Bizneslar", 0], ...(manager() ? [["money", "To'lovlar", 0], ["team", "Jamoa", 0]] : [["team", "Jamoa", 0]])];
  const addKey = S.tab === "leads" ? "newlead" : S.tab === "salons" ? "newsalon" : S.tab === "team" && manager() ? "newuser" : "";
  const addLabel = { newlead: "+ Lid", newsalon: `+ ${manager() ? "Biznes" : "Demo"}`, newuser: "+ Xodim" }[addKey];
  const add = addKey ? `<button class="primary desk" data-${addKey}="1">${addLabel}</button>` : "";
  const ICON = { leads: '<path d="M4 6h16M4 12h16M4 18h10"/>', salons: '<path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/>', money: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
    team: '<circle cx="9" cy="8" r="3"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5M16 5a3 3 0 0 1 0 6M18 15c1.6.6 2.6 2.2 3 5"/>' };
  const navBtn = ([k, v, n]) => `<button data-tab="${k}" aria-current="${S.tab === k ? "page" : "false"}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${v}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  const fab = addKey ? `<button class="fab" data-${addKey}="1" aria-label="${addLabel}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>` : "";
  const half = Math.ceil(tabs.length / 2);
  const bottom = `<nav class="bottom-nav">${tabs.slice(0, half).map(navBtn).join("")}${fab || "<span></span>"}${tabs.slice(half).map(navBtn).join("")}</nav>`;
  const view = S.tab === "salons" ? salonsHtml() : S.tab === "money" ? moneyHtml() : S.tab === "team" ? teamHtml() : leadsHtml();
  return `<div class="wrap">
    <div class="top"><h1><small>NAVBAT PLATFORMASI</small>${{ leads: "Lidlar", salons: "Bizneslar", money: "To'lovlar", team: "Jamoa" }[S.tab]}</h1>
      <span class="who">${S.me.name !== ROLE[S.me.role] ? `${bdi(S.me.name)} · ` : ""}<b>${ROLE[S.me.role]}</b></span><a class="ghost desk" href="/taqdimot" target="_blank" rel="noopener" style="text-decoration:none">Taqdimot</a><button class="ghost desk" id="logout">Chiqish</button>${add}
      <div class="menu-only">${moreMenu("top", [S.tab === "leads" && ["Import (CSV)", 'data-import="1"'], S.tab === "leads" && ["Eksport (CSV)", 'data-export="1"'],
        ["Taqdimot sahifasi", 'href="/taqdimot" target="_blank" rel="noopener"'], "-", ["Chiqish", 'id="logout"', "bad"]])}</div></div>
    ${statsHtml()}
    <nav class="tabs">${tabs.map(([k, v, n]) => `<button data-tab="${k}" aria-current="${S.tab === k ? "page" : "false"}">${v}${n ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</nav>
    ${S.error ? `<div class="notice">${esc(S.error)}</div>` : ""}
    ${S.creds ? `<div class="creds"><b>${bdi(S.creds.name)} ochildi.</b><span>Admin panel <code>${esc(location.host)}/${esc(S.creds.slug)}/admin</code></span><span>Login <code>${esc(S.creds.login)}</code></span><span>Parol <code>${esc(S.creds.password)}</code></span><span class="hint">Parol keyin ko'rsatilmaydi. Endi "Bot ulash" ni bosing.</span></div>` : ""}
    ${view}</div>${bottom}`;
}
function loginHtml() {
  return `<form class="login" id="lform"><h1>Platforma</h1><p class="hint">Navbat jamoasi uchun: lidlar, demolar, bizneslar va to'lovlar.</p>
    ${S.error ? `<div class="notice">${esc(S.error)}</div>` : ""}
    <div class="field"><label for="llogin">Login</label><input id="llogin" autocomplete="username" autocapitalize="none" value="${esc(S.login.login)}"></div>
    <div class="field"><label for="lpass">Parol</label><input id="lpass" type="password" autocomplete="current-password" value="${esc(S.login.password)}"></div>
    <button class="primary" type="submit">Kirish</button></form>`;
}

// ---------- drawers ----------
const field = (id, label, v, extra = "") => `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${esc(v)}" ${extra}></div>`;
const kindChips = (cur) => `<div class="field"><label>Soha</label><div class="months">${KINDS.map(([k, l]) => `<button class="chip" type="button" data-fkind="${k}" aria-pressed="${cur === k}">${l}</button>`).join("")}</div></div>`;
function drawer(title, sub, body, save) {
  return `<div class="scrim" data-close="1"></div><div class="drawer" role="dialog" aria-label="${esc(title)}">
    <header><div><small class="hint">${esc(sub)}</small><h2>${esc(title)}</h2></div><button class="x" data-close="1" aria-label="Yopish">✕</button></header>

}

// ---------- actions ----------
function openLead(l) {
  const more = (x) => ({ district: x?.district || "", size: x?.size || "", staff_count: x?.staff_count ?? null, source: x?.source || "", how_now: x?.how_now || "", lost_reason: x?.lost_reason || "", status: x?.status || "new" });
  S.drawer = l ? { type: "lead", id: l.id, name: l.name, kind: l.kind, phone: l.phone, contact: l.contact, address: l.address, next_step: l.next_step, next_step_on: l.next_step_on, assigned_to: l.assigned_to, note: l.note, ...more(l) }
    : { type: "lead", name: "", kind: "beauty", phone: "", contact: "", address: "", next_step: "", next_step_on: today(), assigned_to: S.me.role === "sales" ? S.me.id : null, note: "", ...more(null) };
}
function openSalon(lead) {
  const demo = !manager() || !!lead;
  S.drawer = { type: "salon", lead, demo, name: lead?.name || "", slug: slugify(lead?.name || ""), slugTouched: false, kind: lead?.kind || "beauty", months: 1, sample: demo,
    phone: lead?.phone || "", address: lead?.address || "", owner_name: lead?.contact || "", owner_login: "owner", owner_password: newPassword() };
}
async function save() {
  const F = S.drawer;
  if (F.type === "lead") {
    if (!F.name.trim()) throw new Error("Biznes nomini yozing");
    const staff = String(F.staff_count ?? "").trim() === "" ? null : +digits(F.staff_count);
    const body = { name: F.name.trim(), kind: F.kind, phone: F.phone.trim(), contact: F.contact.trim(), address: F.address.trim(), next_step: F.next_step.trim(), next_step_on: F.next_step_on || null, note: F.note,
      district: F.district.trim(), size: F.size, staff_count: staff, source: F.source, how_now: F.how_now, status: F.status, lost_reason: F.status === "lost" ? F.lost_reason.trim() : "" };
    if (manager()) body.assigned_to = F.assigned_to;
    const l = F.id ? await api.patch(`/leads/${F.id}`, { ...body, clear_next_step_on: !F.next_step_on, clear_staff_count: staff === null }) : await api.post("/leads", body);
    S.leads = F.id ? S.leads.map((x) => (x.id === l.id ? l : x)) : [l, ...S.leads];
    S.drawer = null; toast(F.id ? "Saqlandi" : "Lid qo'shildi"); await refreshStats(); return;
  }
  if (F.type === "salon") {
    if (!F.name.trim() || !F.owner_name.trim()) throw new Error("Biznes nomi va egasining ismini yozing");
    const s = await api.post("/salons", { slug: F.slug, name: F.name.trim(), phone: F.phone.trim(), branch_address: F.address.trim(), months: F.demo ? 0 : F.months, trial_days: F.demo ? 14 : 0,
      is_demo: F.demo, kind: F.kind, sample_masters: F.sample, owner_name: F.owner_name.trim(), owner_login: F.owner_login.trim().toLowerCase(), owner_password: F.owner_password, lead_id: F.lead?.id || null });
    S.creds = { name: s.name, slug: s.slug, login: F.owner_login.trim().toLowerCase(), password: F.owner_password };
    S.drawer = null; await load(); S.tab = "salons"; render(); toast(`${s.name} ochildi`);
    if (S.salons.some((x) => x.is_demo && x.telegram_bot && x.id !== s.id)) { S.drawer = { type: "takebot", id: s.id }; render(); }
    return;
  }
  if (F.type === "pay") {
    const amount = +digits(F.amount); if (!amount) throw new Error("Summani yozing");
    const s = await api.patch(`/salons/${F.id}`, { extend_months: F.months, amount, is_active: true });
    S.salons = S.salons.map((x) => (x.id === s.id ? s : x)); S.drawer = null; toast(`${s.name}: ${fmtDate(s.paid_until)} gacha`); await load(); return;
  }
  if (F.type === "mods") {
    if (!F.mods.length) throw new Error("Kamida bittasini tanlang");
    const s = await api.patch(`/salons/${F.id}`, { modules: F.mods });
    S.salons = S.salons.map((x) => (x.id === s.id ? s : x)); S.drawer = null; toast(`${s.name}: ${s.modules.map((m) => MODS[m]).join(" + ")}`); return;
  }
  if (F.type === "notes") {
    if (!F.text.trim()) throw new Error("Nima deyilganini yozing");
    await api.post(`/leads/${F.id}/notes`, { kind: F.kind, text: F.text.trim(), day: F.day || null });
    F.text = ""; F.list = null; render();
    [F.list, S.leads] = await Promise.all([api.get(`/leads/${F.id}/notes`), api.get("/leads")]);
    await refreshStats(); toast("Suhbat yozildi"); return;
  }
  if (F.type === "import") {
    let created = 0, skipped = 0;
    for (let i = 0; i < F.rows.length; i += 500) {
      const r = await api.post("/leads/import", { leads: F.rows.slice(i, i + 500), assigned_to: manager() ? F.assigned_to : null });
      created += r.created; skipped += r.skipped;
    }
    S.drawer = null; S.leads = await api.get("/leads"); await refreshStats(); S.filter = "open";
    toast(`${created} ta qo'shildi${skipped ? `, ${skipped} tasi ro'yxatda bor edi` : ""}`); return;
  }
  if (F.type === "goal") {
    await api.put("/goal", { goal: +digits(F.goal) || 0 }); S.drawer = null; await refreshStats(); toast("Maqsad saqlandi"); return;
  }
  if (F.type === "user") {
    const u = await api.post("/team", { name: F.name.trim(), login: F.login.trim().toLowerCase(), password: F.password, role: F.role });
    S.team = [...S.team, u]; S.creds = null; S.drawer = null; toast(`${u.name} qo'shildi. Login: ${u.login}, parol: ${F.password}`); return;
  }
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, .scrim"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (S.busy && !d.close) return;
  S.busy = true;
  try {
    S.error = "";
    if (d.menu) { S.menu = S.menu === d.menu ? null : d.menu; render(); return; }
    if (d.import) { S.menu = null; $("#imp")?.click(); render(); return; }
    S.menu = null;
    if (d.close) { S.drawer = null; }
    else if (d.tab) { S.tab = d.tab; S.q = ""; S.creds = null; window.scrollTo(0, 0); if (d.tab === "money") S.payments = await api.get("/payments"); }
    else if (d.filter) S.filter = d.filter;
    else if (d.view) { S.view = d.view; try { localStorage.setItem("crm-view", d.view); } catch { /* storage off */ } }
    else if (d.notes) { S.drawer = { type: "notes", id: +d.notes, kind: "call", text: "", day: today(), list: null }; render(); S.drawer.list = await api.get(`/leads/${+d.notes}/notes`); }
    else if (d.nkind) S.drawer.kind = d.nkind;
    else if (d.fsize) S.drawer.size = S.drawer.size === d.fsize ? "" : d.fsize;
    else if (d.export) exportLeads();
    else if (d.goal) S.drawer = { type: "goal", goal: S.stats.goal ? String(S.stats.goal) : "" };
    else if (d.newlead) openLead(null);
    else if (d.ledit) openLead(S.leads.find((x) => x.id === +d.ledit));
    else if (d.demo) openSalon(S.leads.find((x) => x.id === +d.demo));
    else if (d.newsalon) openSalon(null);
    else if (d.newuser) S.drawer = { type: "user", name: "", login: "", password: newPassword(), role: "sales" };
    else if (d.pay) S.drawer = { type: "pay", id: +d.pay, months: 1, amount: "" };
    else if (d.setdemo) { const s0 = S.salons.find((x) => x.id === +d.setdemo), s = await api.patch(`/salons/${s0.id}`, { is_demo: !s0.is_demo }); S.salons = S.salons.map((x) => (x.id === s.id ? s : x)); toast(s.is_demo ? `${s.name} endi demo: boti boshqa demoga o'tkazilishi mumkin` : `${s.name} endi oddiy mijoz`); }
    else if (d.mods) S.drawer = { type: "mods", id: +d.mods, mods: [...(S.salons.find((x) => x.id === +d.mods).modules || ["booking"])] };
    else if (d.fmod) S.drawer.mods = S.drawer.mods.includes(d.fmod) ? S.drawer.mods.filter((m) => m !== d.fmod) : [...S.drawer.mods, d.fmod];
    else if (d.takebot) S.drawer = { type: "takebot", id: +d.takebot };
    else if (d.donor) { const s = await api.post(`/salons/${S.drawer.id}/take-bot`, { from_salon_id: +d.donor }); S.drawer = null; await load(); toast(`@${s.telegram_bot} endi ${s.name} boti`); }
    else if (d.fkind) S.drawer.kind = d.fkind;
    else if (d.fdemo) S.drawer.demo = d.fdemo === "1";
    else if (d.fmonths) S.drawer.months = +d.fmonths;
    else if (d.fsample) S.drawer.sample = !S.drawer.sample;
    else if (d.frole) S.drawer.role = d.frole;
    else if (t.id === "f-save") await save();
    else if (d.ask) S.ask = +d.ask;
    else if (d.keep) S.ask = null;
    else if (d.stop || d.resume) { const s = await api.patch(`/salons/${+(d.stop || d.resume)}`, { is_active: !!d.resume }); S.salons = S.salons.map((x) => (x.id === s.id ? s : x)); S.ask = null; toast(d.stop ? `${s.name} to'xtatildi` : `${s.name} yoqildi`); }
    else if (d.newpw) { const pw = newPassword(), u = await api.patch(`/team/${+d.newpw}`, { password: pw }); toast(`${u.name}: yangi parol ${pw}`); }
    else if (d.toggleu) { const u0 = S.team.find((x) => x.id === +d.toggleu), u = await api.patch(`/team/${u0.id}`, { is_active: !u0.is_active }); S.team = S.team.map((x) => (x.id === u.id ? u : x)); }
    else if (t.id === "logout") { await api.post("/logout", {}); S.me = null; S.creds = null; S.login = { login: "", password: "" }; }
    else return;
  } catch (err) { S.error = err.message; }
  finally { S.busy = false; }

});
document.addEventListener("change", async (e) => {
  const el = e.target, d = el.dataset, F = S.drawer;

    else if (el.id === "imp" && el.files[0]) { const f = el.files[0]; el.value = ""; S.drawer = await readImport(f); render(); }
    else if (el.id === "fkind") { S.fkind = el.value; render(); }
    else if (el.id === "fwho") { S.fwho = el.value; render(); }
    else if (F && el.id === "f-status") { F.status = el.value; render(); }

// ---------- CSV: a list from the maps or a spreadsheet in, the whole list out ----------
// Excel saves CSV with ";" or "," and sometimes in the old Windows encoding: both are read.
function parseCsv(text) {
  const first = text.split("\n")[0], sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : (first.includes("\t") && !first.includes(",") ? "\t" : ",");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
const COLS = { name: ["nomi", "nom", "name", "biznes", "biznes nomi", "название", "компания"], kind: ["soha", "kind", "turi", "sohasi", "категория"], phone: ["telefon", "phone", "tel", "телефон"],
  contact: ["kim", "kim bilan", "contact", "egasi", "aloqa", "контакт"], address: ["manzil", "address", "адрес"], district: ["tuman", "shahar", "district", "район", "город"],
  size: ["hajm", "hajmi", "size"], staff_count: ["xodimlar", "xodimlar soni", "staff", "staff_count"], source: ["manba", "qayerdan", "source", "qayerdan topildi"],
  status: ["bosqich", "holat", "status"], next_step: ["keyingi qadam", "next_step"], note: ["izoh", "note", "комментарий"] };
const LIMITS = { name: 120, phone: 20, contact: 120, address: 255, district: 80, source: 40, next_step: 200, note: 4000 };
function kindOf(v) {
  const x = v.toLowerCase();
  const hit = KINDS.find(([k, l]) => k === x || l.toLowerCase() === x);
  if (hit) return hit[0];
  const rules = [["dental", /stomat|tish|dent|стомат/], ["clinic", /klinik|clinic|шифо|клиник|medic/], ["cosmetology", /kosmet|космет/], ["barber", /barber|sartarosh|барбер/],
    ["beauty", /salon|go'zal|gozal|ayollar|beauty|салон|красот|nail|tirnoq/], ["spa", /spa|massaj|массаж/], ["auto", /avto|auto|авто/], ["vet", /vet|вет/], ["shop", /gul|tort|do'kon|dokon|shop|магазин|цвет/]];
  return (rules.find(([, rx]) => rx.test(x)) || ["other"])[0];
}
function sizeOf(v) { const x = v.toLowerCase(); return /^kich|^small|^мал/.test(x) ? "small" : /^o.?rta|^medium|^сред/.test(x) ? "medium" : /^yirik|^katta|^large|^круп/.test(x) ? "large" : ""; }
function statusOf(v) { const x = v.toLowerCase(); const hit = STATUSES.find(([k, l]) => k === x || l.toLowerCase() === x); return hit && !["trial", "paid"].includes(hit[0]) ? hit[0] : "new"; }
async function readImport(file) {
  const buf = await file.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  if (text.includes("\uFFFD")) text = new TextDecoder("windows-1251").decode(buf);
  const rows = parseCsv(text.replace(/^\uFEFF/, ""));
  if (rows.length < 2) throw new Error("Faylda sarlavha qatori va kamida bitta biznes bo'lishi kerak");
  const head = rows[0].map((h) => h.trim().toLowerCase().replace(/[ʻʼ‘`]/g, "'"));
  const at = Object.fromEntries(Object.entries(COLS).map(([k, names]) => [k, head.findIndex((h) => names.includes(h))]));
  if (at.name < 0) throw new Error("\"nomi\" ustuni topilmadi. Birinchi qatorda ustun nomlari bo'lsin: nomi, soha, telefon, tuman, manzil, izoh");
  let bad = 0; const out = [];
  for (const r of rows.slice(1)) {
    const g = (k) => (at[k] >= 0 ? String(r[at[k]] || "").trim() : "").slice(0, LIMITS[k] || 200);
    if (!g("name")) { bad++; continue; }
    const staff = +digits(g("staff_count"));
    out.push({ name: g("name"), kind: g("kind") ? kindOf(g("kind")) : "other", phone: g("phone"), contact: g("contact"), address: g("address"), district: g("district"),
      size: sizeOf(g("size")), staff_count: staff > 0 && staff <= 10000 ? staff : null, source: g("source"), status: statusOf(g("status")), next_step: g("next_step"), note: g("note") });
  }
  if (!out.length) throw new Error("Faylda nomi yozilgan biznes topilmadi");
  return { type: "import", file: file.name, rows: out, bad, assigned_to: null };
}
