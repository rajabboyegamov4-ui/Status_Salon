<meta charset="utf-8">
<title>Onlayn bron</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a booking app. Thin top bar with a progress line, content in one column,
   a floating bottom action. Clean white cards on a soft paper ground, black as the action colour. */
:root {
  --bg: #f3f3f0;
  --surface: #ffffff;
  --soft: #ebebe6;
  --fg: #111111;
  --muted: #6c6c68;
  --line: #e4e4df;
  --primary: #111111;
  --on-primary: #ffffff;
  --star: #f2a900;
  --danger: #c4361f;
  --ok: #1f8a4c;
  --shadow: 0 1px 2px rgb(17 17 17 / .05), 0 8px 24px rgb(17 17 17 / .06);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --surface: #171717; --soft: #222222; --fg: #f4f4f2; --muted: #9b9b96; --line: #2a2a2a;
    --primary: #f4f4f2; --on-primary: #111111; --star: #ffc233; --danger: #ff7a62; --ok: #4fcf86;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --surface: #171717; --soft: #222222; --fg: #f4f4f2; --muted: #9b9b96; --line: #2a2a2a;
  --primary: #f4f4f2; --on-primary: #111111; --star: #ffc233; --danger: #ff7a62; --ok: #4fcf86;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
img { display: block; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.bar-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 10px 16px; min-height: 60px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.icon-btn[disabled] { visibility: hidden; }
.title { min-width: 0; text-align: center; }
.title b { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { display: flex; gap: 6px; align-items: center; justify-content: flex-end; min-width: 40px; }
.pill-btn { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.demo-badge { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--soft); padding: 3px 8px; border-radius: 99px; }
.progress { height: 3px; background: var(--line); }
.progress span { display: block; height: 100%; background: var(--fg); border-radius: 0 3px 3px 0; transition: width .3s ease; }

main { flex: 1; padding: 16px 16px 132px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 0; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.lead { color: var(--muted); margin: -10px 0 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 6px; }
.section-head span { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
.empty { color: var(--muted); background: var(--surface); border-radius: 18px; padding: 24px; text-align: center; }
.notice { border-radius: 14px; padding: 12px 14px; font-size: 14px; background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.notice .small-btn { background: var(--surface); color: var(--fg); }
.info-line b { white-space: nowrap; }
.info-line { margin: -4px 0 0; font-size: 14px; padding: 10px 14px; border-radius: 14px; background: var(--soft); }
.hint { font-size: 13px; color: var(--muted); }
.link { background: none; border: 0; color: var(--fg); font-weight: 700; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.spinner { width: 24px; height: 24px; border: 2.5px solid var(--line); border-top-color: var(--fg); border-radius: 50%; animation: spin .8s linear infinite; margin: 28px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.star { color: var(--star); }

/* salon header */
.salon { overflow: hidden; }
.salon .cover { height: 150px; background: #1b1b1b; position: relative; }
.salon .cover img { width: 100%; height: 100%; object-fit: cover; }
.salon .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.salon .logo { width: 68px; height: 68px; border-radius: 20px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 26px; margin-top: -34px; border: 4px solid var(--surface); position: relative; overflow: hidden; }
.salon .logo img { width: 100%; height: 100%; object-fit: cover; }
.salon h2 { font-size: 22px; font-weight: 800; }
.salon p { margin: 0; color: var(--muted); font-size: 14px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 12px; min-height: 44px; border-radius: 99px; background: var(--soft); color: var(--fg); text-decoration: none; border: 0; }
.chip svg { flex: none; }

/* branch filter */
.seg { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
.seg button { flex: none; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 9px 16px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

.any-card{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:14px 16px;margin:0 0 12px;border:1px dashed currentColor;border-radius:16px;background:none;cursor:pointer}
.any-card small{opacity:.7}
/* barber grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.bcard { display: flex; flex-direction: column; gap: 10px; text-align: left; border: 0; padding: 8px 8px 12px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); min-width: 0; transition: transform .15s ease; }
.bcard:active { transform: scale(.98); }
.bcard.wide { grid-column: 1 / -1; }
.bcard.wide .photo { aspect-ratio: 16 / 10; }
.bcard.wide .photo img { object-position: center 30%; }
.bcard .photo { position: relative; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; background: var(--soft); max-width: 100%; }
.bcard .photo img { width: 100%; height: 100%; object-fit: cover; }
.bcard .photo .initial { width: 100%; height: 100%; display: grid; place-items: center; font-size: 44px; font-weight: 800; color: var(--muted); }
.tag { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 99px; background: rgb(255 255 255 / .92); color: #111; }
.tag.top { background: #111; color: #fff; }
.rate-tag { position: absolute; left: 8px; bottom: 8px; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 99px; background: rgb(255 255 255 / .92); color: #111; }
.rate-tag b { color: #e09b00; }
.bcard .info { padding: 0 6px; min-width: 0; }
.bcard .name { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcard .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* barber profile */
.ph { position: relative; border-radius: 26px; overflow: hidden; background: var(--soft); aspect-ratio: 1 / 1; max-height: 420px; width: 100%; }
.ph > img { width: 100%; height: 100%; object-fit: cover; }
.ph .initial { width: 100%; height: 100%; display: grid; place-items: center; font-size: 90px; font-weight: 800; color: var(--muted); }
.ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0) 45%, rgb(0 0 0 / .78) 100%); }
.ph .over { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; color: #fff; display: flex; flex-direction: column; gap: 4px; }
.ph .over .tag { position: static; align-self: flex-start; }
.ph h2 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.ph .over small { font-size: 14px; color: rgb(255 255 255 / .85); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px 4px; }
.stats div { text-align: center; border-left: 1px solid var(--line); min-width: 0; }
.stats div:first-child { border-left: 0; }
.stats b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12px; }
.ig { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--fg); text-decoration: none; }
.ig .glyph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(45deg, #f9a03f, #e1306c 55%, #833ab4); flex: none; }
.ig b { display: block; font-size: 15px; }
.ig small { color: var(--muted); font-size: 12px; }
.ig .go { margin-left: auto; font-weight: 700; font-size: 13px; background: var(--soft); border-radius: 99px; padding: 7px 12px; white-space: nowrap; }
.bio { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--soft); border-radius: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 3; }
.tabs button { border: 0; background: none; border-radius: 11px; padding: 9px 4px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.works { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.works button { padding: 0; border: 0; background: var(--soft); border-radius: 14px; overflow: hidden; aspect-ratio: 1; max-width: 100%; }
.works img { width: 100%; height: 100%; object-fit: cover; }
.score { display: flex; align-items: center; gap: 14px; padding: 16px; }
.score > b { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score .stars { font-size: 18px; letter-spacing: 1px; }
.review { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.review .who { display: flex; align-items: center; gap: 10px; }
.review .av { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.review .who div { flex: 1; min-width: 0; }
.review .who b { display: block; font-size: 14px; }
.review .who small { color: var(--muted); font-size: 12px; }
.review p { margin: 0; }
.review .stars { font-size: 13px; white-space: nowrap; }
.rows { padding: 2px 16px; }
.rows > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.rows > div:first-child { border-top: 0; }
.rows small { display: block; color: var(--muted); font-size: 12px; }
.rows b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.place { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.place b { font-size: 16px; }
.place .addr { color: var(--muted); font-size: 14px; }
.place iframe { width: 100%; height: 190px; border: 0; border-radius: 14px; }

/* services */
.svc { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; padding: 14px 14px 14px 16px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.svc .main { flex: 1; min-width: 0; }
.svc .name { font-weight: 700; display: block; }
.svc .sub { color: var(--muted); font-size: 13px; display: block; }
.svc .price { font-weight: 700; font-variant-numeric: tabular-nums; display: block; margin-top: 4px; }
.plus { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; transition: background .15s ease; }
.svc[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg), var(--shadow); }
.svc[aria-pressed="true"] .plus { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.list { display: flex; flex-direction: column; gap: 10px; }
.cat { font-size: 13px; font-weight: 700; color: var(--muted); margin: 4px 0 -6px; }

/* time */
.who-line { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.who-line img, .who-line .mini { width: 44px; height: 44px; border-radius: 14px; object-fit: cover; background: var(--soft); display: grid; place-items: center; font-weight: 800; flex: none; }
.who-line div { flex: 1; min-width: 0; }
.who-line small { color: var(--muted); font-size: 13px; display: block; }
.days { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.day { flex: none; width: 58px; padding: 10px 0; border-radius: 18px; border: 0; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.mon { flex: none; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 -2px; }
.alt { border: 0; width: 100%; text-align: left; color: inherit; }
.alt .go { font-weight: 700; font-size: 13px; background: var(--soft); border-radius: 99px; padding: 7px 12px; white-space: nowrap; flex: none; }
.day b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.day[aria-pressed="true"] small { color: var(--on-primary); opacity: .75; }
.day[disabled] { opacity: .35; cursor: not-allowed; box-shadow: none; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { padding: 11px 0; border-radius: 14px; border: 0; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-variant-numeric: tabular-nums; }
.slot[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field textarea { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; width: 100%; font-size: 16px; }
.field input:focus, .field textarea:focus { border-color: var(--fg); outline: none; }
.phone { display: flex; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; }
.phone:focus-within { border-color: var(--fg); }
.phone span { padding-left: 16px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 16px; }
.phone input { border: 0 !important; background: transparent; }
.code-input { letter-spacing: .6em; font-size: 24px !important; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.demo-code { margin: 0; background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.demo-code b { letter-spacing: .15em; }
.big-btn { width: 100%; border: 0; border-radius: 99px; padding: 16px; font-weight: 700; font-size: 16px; background: var(--primary); color: var(--on-primary); }
.big-btn.tg { display: flex; align-items: center; justify-content: center; gap: 10px; background: #0a6fb0; color: #fff; text-decoration: none; }
.big-btn.ghost { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.tg-card { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.tg-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.waiting { margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); }
.waiting .dot { width: 8px; height: 8px; border-radius: 50%; background: #2aabee; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.big-btn[disabled] { opacity: .35; cursor: not-allowed; }

/* summary */
.when { padding: 18px 16px 14px; display: flex; align-items: center; gap: 14px; border-bottom: 1px dashed var(--line); }
.when .clock { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.when small { display: block; color: var(--muted); font-size: 13px; }
.when b { font-size: 15px; }
.total span:last-child, .visit > div > b { white-space: nowrap; }
.total { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-top: 1px dashed var(--line); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
.done-mark { width: 76px; height: 76px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 12px auto 0; }
.center { text-align: center; }

/* my visits */
.visit { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.visit .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.visit .top b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.status { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--soft); }
.status.ok { background: color-mix(in srgb, var(--ok) 15%, var(--surface)); color: var(--ok); }
.rate { display: flex; gap: 6px; }
.rate button { width: 46px; height: 46px; border-radius: 14px; border: 0; background: var(--soft); font-size: 22px; color: var(--muted); }
.rate button[aria-pressed="true"] { color: var(--star); background: color-mix(in srgb, var(--star) 16%, var(--surface)); }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acts .small-btn { padding: 8px 10px; text-align: center; }
.acts .wide { grid-column: 1 / -1; }
.small-btn { border: 0; background: var(--soft); border-radius: 99px; padding: 8px 14px; min-height: 44px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--fg); text-decoration: none; }
.small-btn[disabled] { opacity: .5; cursor: not-allowed; }
.hint a, .empty a, .lead a { color: var(--fg); font-weight: 700; text-underline-offset: 3px; }
.small-btn.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.small-btn.primary { background: var(--primary); color: var(--on-primary); }

/* bottom action */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, var(--bg) 30%); }
.bar-inner { max-width: 488px; margin: 0 auto; display: flex; align-items: center; gap: 12px; background: var(--surface); box-shadow: 0 10px 30px rgb(0 0 0 / .14); border-radius: 99px; padding: 8px 8px 8px 20px; }
.summary { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); line-height: 1.3; }
.summary b { display: block; color: var(--fg); font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cta { background: var(--primary); color: var(--on-primary); border: 0; border-radius: 99px; padding: 14px 24px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.cta[disabled] { opacity: .35; cursor: not-allowed; }

.lightbox { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .92); display: grid; place-items: center; padding: 16px; border: 0; width: 100%; }
.lightbox > span { max-width: 100%; }
.lightbox img { max-width: 100%; height: auto; max-height: 80vh; object-fit: contain; border-radius: 18px; }
.lightbox span { color: #f4f4f2; margin-top: 10px; font-weight: 600; }
@media (max-width: 359px) {
  .bar { padding-left: 10px; padding-right: 10px; }
  .bar-inner { gap: 8px; padding: 6px 6px 6px 14px; }
  .cta { padding: 13px 16px; font-size: 14px; }
  .summary b { font-size: 15px; }
  .bar-row { padding: 10px 12px; gap: 6px; }
  .demo-badge { display: none; }
}
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .progress span, .bcard { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="bar-row">
      <button class="icon-btn" id="back" aria-label="Orqaga">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5L5.5 9l5.5 5.5"/></svg>

const WEEK = ["Ya", "Du", "Se", "Ch", "Pa", "Ju", "Sh"];
const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
const TZ = "Asia/Tashkent";
const tashkentParts = (d) => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));

// ---------- real API (served by FastAPI at /api/s/{salon}) ----------
const realApi = {
  // A lost network or a stuck request ends in 15 s with a message in Uzbek, never "Failed to fetch".
  async call(path, opts = {}) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    let res, body;
    try {
      res = await fetch(`/api/s/${SLUG}` + path, { ...opts, signal: ctl.signal, credentials: "same-origin", headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
      body = res.status === 204 ? null : await res.json().catch(() => undefined);
    } catch { throw new ApiError(0, NET_ERR); }
    finally { clearTimeout(timer); }
    if (res.status === 204) return null;
    if (res.status >= 500 || (res.ok && body === undefined)) throw new ApiError(res.status, SERVER_ERR);
    if (!res.ok) throw new ApiError(res.status, typeof body?.detail === "string" ? body.detail : "Xatolik yuz berdi. Qayta urinib ko'ring.");
    return body;
  },
  branches() { return this.call("/branches"); },
  services(b) { return this.call(`/branches/${b}/services`); },
  allMasters() { return this.call("/masters"); },
  masterServices(m) { return this.call(`/masters/${m}/services`); },
  dates(b, s, m) { return this.call(`/available-dates?branch_id=${b}&service_ids=${s.join(",")}${m ? "&master_id=" + m : ""}`); },
  slots(b, s, d, m) { return this.call(`/available-slots?branch_id=${b}&service_ids=${s.join(",")}&date=${d}${m ? "&master_id=" + m : ""}`); },
  me() { return this.call("/auth/me").catch(() => null); },
  webapp(initData) { return this.call("/auth/webapp", { method: "POST", body: JSON.stringify({ init_data: initData }) }); },
  requestCode(phone) { return this.call("/auth/request-code", { method: "POST", body: JSON.stringify({ phone }) }); },
  tgStart() { return this.call("/auth/telegram", { method: "POST" }); },
  tgPoll(token) { return this.call(`/auth/telegram/${token}`); },
  verify(phone, code, name) { return this.call("/auth/verify", { method: "POST", body: JSON.stringify({ phone, code, name }) }); },
  book(payload, key) { return this.call("/bookings", { method: "POST", body: JSON.stringify(payload), headers: { "Idempotency-Key": key } }); },
  reviews(mid) { return this.call(`/masters/${mid}/reviews`); },
  myBookings() { return this.call("/me/bookings"); },
  cancel(id) { return this.call(`/bookings/${id}/cancel`, { method: "POST" }); },
  review(id, rating, comment) { return this.call(`/bookings/${id}/review`, { method: "POST", body: JSON.stringify({ rating, comment }) }); },
};

    const out = [];
    for (let i = 0; i < 4; i++) { h = (h * 1103515245 + 12345) >>> 0; const startMin = 600 + (h % 40) * 15; out.push([startMin, startMin + 30 + (h % 3) * 15]); }

    tgStart() { tgState = "pending"; return wait({ token: "demo", url: "https://t.me/premiumbarber_bot?start=demo", bot: "premiumbarber_bot" }); },

        const [hh, mm] = hhmm(p.starts_at).split(":").map(Number), s = hh * 60 + mm;

          ends_at: new Date(Date.parse(p.starts_at) + q.duration_min * 60000).toISOString(), total_price: q.price, status: "confirmed", review_rating: null,
          items: sel(p.service_ids).map((x) => ({ service_id: x.id, service_name: x.name, price: Math.round(x.price * m.k), duration_min: x.duration_min })) };

// The phone's own Back button walks back through the steps instead of leaving the site.

// The flow survives a trip to Telegram (the tab may be reloaded or killed): kept per tab, per salon.
const SAVE_KEY = "bron:" + SLUG;
function persist() {

    const tg = (S.step === 4 || S.step === 7) && S.tg && !S.tgExpired && !S.user ? { token: S.tg.token, url: S.tg.url, bot: S.tg.bot } : null;

async function go(step, fromHistory = false) {

  const n = ++seq;
  S.error = S.flash || ""; S.flash = ""; S.retry = null; S.step = step;
  const keep = S.slot;
  if (step === 3) { S.slot = null; S.slots = []; S.dates = []; S.slotsLoading = true; S.jumped = false; }
  render(); window.scrollTo(0, 0);
  try {
    if (step === 0 && !S.loaded) { [S.masters, S.branches] = await Promise.all([api.allMasters(), api.branches()]); S.loaded = true; }
    if (step === 1) { S.profileReviews = null; render(); const [rv] = await Promise.all([api.reviews(S.master).catch(() => []), loadServices(n)]); if (!stale(n)) S.profileReviews = rv; }
    if (step >= 2 && step <= 5) await loadServices(n);

// ---------- log in through the salon's Telegram bot ----------
const useTelegram = () => !!S.salon?.telegram_bot;
async function startTelegram(n) {
  const at = S.step, resume = S.tgResume;
  S.tg = null; S.tgExpired = false; S.tgResume = null; render();
  const tg = resume || await api.tgStart(); if (stale(n)) return;
  S.tg = tg; render();
  // Ask the server every 2 seconds whether the client confirmed in the bot, and at once when they come back to the tab.
  for (let first = !!resume; !stale(n) && S.step === at; first = false) {
    if (!first && !S.woke) { await new Promise((r) => { S.wake = r; setTimeout(r, 2000); }); S.wake = null; }
    S.woke = false;

// Where a step may be opened from history: it needs the choices made before it.
function reachable(step) {
  if (step >= 1 && !chosenMaster()) return 0;
  if (step >= 3 && !S.picked.size) return 2;
  if (step >= 4 && !S.slot) return 3;

}
window.addEventListener("popstate", (e) => {

  S.zoom = null;

  if (want === 7) return openMine(true);

async function openMine(fromHistory = false) {

  const n = ++seq; S.step = 7; S.visits = null; S.error = S.flash || ""; S.flash = ""; S.retry = null; S.cancelAsk = null; render(); window.scrollTo(0, 0);

// On load: come back to where the client was (e.g. after confirming in Telegram the tab was reloaded).

    [S.masters, S.branches] = await Promise.all([api.allMasters(), api.branches()]); S.loaded = true;
    if (sv.master === ANY_ID || S.masters.some((m) => m.id === sv.master)) {

// ---------- add to calendar: a Google Calendar link and an .ics file for any phone calendar ----------
const calStamp = (iso) => new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
function calEvent(r) {
  const b = branchOf(r), items = (r.items || []).map((i) => i.service_name).join(" + ");
  const end = r.ends_at || new Date(Date.parse(r.starts_at) + (r.items || []).reduce((a, i) => a + (i.duration_min || 0), 0) * 60000 || Date.parse(r.starts_at) + 3600e3).toISOString();
  return { title: `${S.salon?.name || "Bron"}: ${r.master_name}`, start: r.starts_at, end, where: [r.branch_name, b?.address].filter(Boolean).join(", "),
    details: [items, `Bron raqami #${r.id}`, salonPhone(b) && `Tel: ${salonPhone(b)}`].filter(Boolean).join("\n") };
}
const gcalUrl = (ev) => `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${calStamp(ev.start)}/${calStamp(ev.end)}&location=${encodeURIComponent(ev.where)}&details=${encodeURIComponent(ev.details)}`;
function downloadIcs(r) {
  const ev = calEvent(r), x = (v) => String(v).replace(/[\\,;]/g, "\\$&").replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Onlayn Bron//UZ", "CALSCALE:GREGORIAN", "BEGIN:VEVENT", `UID:bron-${r.id}-${SLUG || "demo"}@bron`, `DTSTAMP:${calStamp(new Date().toISOString())}`,
    `DTSTART:${calStamp(ev.start)}`, `DTEND:${calStamp(ev.end)}`, `SUMMARY:${x(ev.title)}`, `LOCATION:${x(ev.where)}`, `DESCRIPTION:${x(ev.details)}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT1H", `DESCRIPTION:${x(ev.title)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  try {
    const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" })), a = document.createElement("a");
    a.href = url; a.download = `bron-${r.id}.ics`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch { /* very old browser: the Google link still works */ }
}

const isUpcoming = (v) => (v.status === "confirmed" || v.status === "pending") && Date.parse(v.starts_at) >= Date.now();
function visitHtml(v) {
  const di = dayInfo(tashkentParts(new Date(v.starts_at)).date), r = S.rating[v.id] || 0;
  const label = { confirmed: "Kutilmoqda", completed: "Bo'ldi", cancelled: "Bekor qilingan", no_show: "Kelmadingiz", pending: "Kutilmoqda" }[v.status];

  if (isUpcoming(v)) {

        ? `<div class="hint">Bron bekor qilinsinmi?</div><div class="row2"><button class="small-btn" data-cancel-keep="1" ${busy}>Yo'q</button><button class="small-btn danger" data-cancel-visit="${v.id}" ${busy}>${S.act === "c" + v.id ? "Bekor qilinmoqda…" : "Ha, bekor qilish"}</button></div>`

    <div class="card place"><b>Kalendarga qo'shish</b><span class="hint">Eslatma telefoningizda ham tursin.</span>
      <div class="acts"><a class="small-btn" href="${esc(gcalUrl(ev))}" target="_blank" rel="noopener">Google Calendar</a><button class="small-btn" id="ics">Boshqa (.ics)</button></div></div>
    <button class="big-btn" id="rebook-last">Yana shu ${esc(term())}ga</button>
    <button class="big-btn ghost" id="again">Boshqa ${esc(term())}ga bron</button>`; },
};

const TITLES = ["", "Usta", "Xizmat", "Vaqt", "Kirish", "Tasdiqlash", "Tayyor", "Bronlarim"];
function render() {
  $("#layer").innerHTML = S.zoom ? `<button class="lightbox" data-unzoom="1" aria-label="Yopish"><span style="display:flex;flex-direction:column;align-items:center"><img src="${esc(S.zoom.url)}" alt=""><span>${esc(S.zoom.caption || "")}</span></span></button>` : "";
  $("#mine").hidden = S.step === 7;
  $("#demo-badge").hidden = !S.demo || !!S.user;
  $("#step-title").textContent = S.step === 0 ? (S.salon?.name || "Onlayn bron") : S.step === 1 && chosenMaster() ? chosenMaster().name : TITLES[S.step];
  $("#step-label").textContent = S.step === 0 ? "Onlayn bron" : S.step >= 1 && S.step <= 5 ? `${S.step + 1}-qadam, 6 tadan` : "";
  $("#steps").style.width = S.step === 7 ? "0" : `${Math.min(S.step + 1, 6) / 6 * 100}%`;
  persist();
  if (S.step === 7) { $("#back").disabled = false; $("#view").innerHTML = views[7](); $("#bar").hidden = true; return; }
  const done = S.step === 6;
  $("#back").disabled = S.step === 0 || done;
  $("#view").innerHTML = views[S.step]();
  const t = totals(), m = chosenMaster();
  $("#summary").innerHTML = S.step === 1 && m ? `<b>${esc(m.name)}</b>${S.services.length ? `${som(Math.min(...S.services.map((s) => s.price)))} dan` : esc(S.branch?.name || "")}`
    : S.picked.size ? `<b>${som(t.price)}</b>${t.dur} daqiqa${S.slot && S.step >= 3 ? " · " + hhmm(S.slot) : ""}` : m ? `<b>${esc(m.name)}</b>xizmat tanlang` : "";
  const cta = $("#cta");
  cta.textContent = S.step === 1 ? "Bron qilish" : S.step === 5 ? (S.busy ? "Yuborilmoqda…" : "Tasdiqlash") : S.step === 4 ? (S.busy ? "Tekshirilmoqda…" : "Kirish") : "Davom etish";
  cta.disabled = !canContinue() || S.busy;
  $("#bar").hidden = done || S.step === 0 || (S.step === 4 && (useTelegram() || !S.codeSent)) || (S.step === 1 && !m);
  if (S.step === 3) {  // keep the picked day in sight (innerHTML resets the row's scroll)
    const row = $(".days"), el = row?.querySelector('[aria-pressed="true"]');
    if (el) { const a = el.getBoundingClientRect(), c = row.getBoundingClientRect(); row.scrollLeft += a.left - c.left - (c.width - a.width) / 2; }
  }
}

// ---------- events ----------
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.unzoom) { S.zoom = null; render(); return; }
  if (d.ptab) { S.ptab = d.ptab; render(); return; }
  if (d.zoom) { S.zoom = { url: d.zoom, caption: d.caption }; render(); return; }
  if (t.id === "mine") return openMine();
  if (d.cancelAsk) { S.cancelAsk = +d.cancelAsk; render(); return; }
  if (d.cancelKeep) { S.cancelAsk = null; render(); return; }
  // One request at a time: the buttons stay disabled until the answer comes.
  if (d.cancelVisit || d.sendReview) {
    if (S.act) return;
    const id = +(d.cancelVisit || d.sendReview), n = seq;
    S.act = (d.cancelVisit ? "c" : "r") + id; S.error = ""; S.retry = null; render();
    try {
      if (d.cancelVisit) await api.cancel(id); else await api.review(id, S.rating[id], S.reviewText[id] || "");
      const v = await api.myBookings(); if (!stale(n)) S.visits = v;
      if (d.cancelVisit) S.cancelAsk = null;
    } catch (err) { if (err.status === 401) return signedOut(); S.error = err.message; if (d.cancelVisit) S.cancelAsk = null; }
    S.act = null; if (!stale(n)) render(); return;
  }
  if (d.rate) { S.rating[+d.rate] = +d.n; render(); return; }
  if (d.rebook) { const v = (S.visits || []).find((x) => x.id === +d.rebook); if (v) rebook(v.master_id, (v.items || []).map((i) => i.service_id).filter(Boolean), t); return; }
  if (d.switch) { rebook(+d.switch, ids(), t); return; }
  if (d.open) openBarber(+d.open);
  else if ("filter" in d) { S.filter = d.filter ? +d.filter : null; render(); }
  else if (d.service) { const id = +d.service; S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id); S.slot = null; S.key = uuid(); render(); }
  else if (d.date) pickDate(d.date);
  else if (d.slot) { S.slot = d.slot; S.key = uuid(); render(); }
  else if (t.id === "cta") next();
  else if (t.id === "back") {
    if (history.state && history.state.step === S.step && history.length > 1) history.back();
    else go(S.step === 7 || S.step === 0 ? 0 : S.step === 5 && S.user ? 3 : S.step - 1);
  }
  else if (t.id === "send-code") sendCode();
  else if (t.id === "tg-retry") S.step === 7 ? openMine(true) : go(4, true);
  else if (t.id === "retry") { const r = S.retry; S.retry = null; r === "slots" ? pickDate(S.date) : S.step === 7 ? openMine(true) : go(S.step, true); }
  else if (t.id === "ics") downloadIcs(S.result);
  else if (t.id === "rebook-last") { const r = S.result; rebook(r.master_id, r.items?.length ? r.items.map((i) => i.service_id) : ids(), t); }
  else if (t.id === "tg-demo") { api.tgConfirm(); t.textContent = "Tasdiqlandi, kuting…"; t.disabled = true; }
  else if (t.id === "fill-code") { S.code = "123456"; if (S.name.trim()) verify(); else { render(); $("#name")?.focus(); } }
  else if (t.id === "change-phone") { S.codeSent = false; S.code = ""; S.error = ""; render(); }
  else if (t.id === "again") restart();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.zoom) { S.zoom = null; render(); }
  if (e.key === "Enter" && S.step === 4 && !S.busy && !useTelegram() && S.salon?.sms_login !== false) { e.preventDefault(); S.codeSent ? verify() : sendCode(); }
});
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "name") S.name = e.target.value;
  if (id === "phone") {
    // Accept "90 123 45 67", "+998 90 123 45 67" or "998901234567"; keep the 9 local digits.
    let digits = e.target.value.replace(/\D/g, "");
    if (digits.length > 9 && digits.startsWith("998")) digits = digits.slice(3);
    digits = digits.slice(0, 9);
    S.phone = [digits.slice(0, 2), digits.slice(2, 5), digits.slice(5, 7), digits.slice(7, 9)].filter(Boolean).join(" ");
    e.target.value = S.phone;
  }
  if (id === "code") {
    S.code = e.target.value.replace(/\D/g, "").slice(0, 6); e.target.value = S.code;
    if (S.code.length === 6 && S.name.trim() && !S.busy) return verify();  // no need to hunt for the button
  }
  if (id === "comment") S.comment = e.target.value;
  if (id.startsWith("rv-")) { S.reviewText[+id.slice(3)] = e.target.value; return; }
  const cta = $("#cta"); cta.disabled = !canContinue() || S.busy;
});

// Use the real server when the page is served by it; otherwise run the built-in demo.
(async () => {
  try {
    const r = await fetch("/api/health"); if (!r.ok || !(await r.json()).ok) throw 0;
    const info = await fetch(`/api/s/${SLUG}`).then((x) => (x.ok ? x.json() : null)).catch(() => null);
    const closed = (msg) => { $("#bar").hidden = true; $("#back").disabled = true; $("#view").innerHTML = `<h1>${esc(info?.name || "Salon")}</h1><p class="lead">${msg}</p>`; };
    if (!info) return closed("Bunday salon topilmadi. Manzilni tekshiring.");
    document.title = `${info.name} · Bron`; S.salon = info; STEPS[0] = TITLES[1] = TERM();
    if (!info.active) return closed(`Onlayn bron vaqtincha ishlamayapti. Iltimos, salonga qo'ng'iroq qiling${info.phone ? `: <a href="tel:${esc(info.phone)}">${esc(info.phone)}</a>` : "."}`);
    S.user = await realApi.me();
    if (!S.user && TG_INIT) S.user = await realApi.webapp(TG_INIT).catch(() => null);
  }
  catch { S.demo = true; api = demoApi; S.salon = DEMO_SALON; }
  boot();
})();
</script>
