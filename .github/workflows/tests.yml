name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: migrations apply on an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/salon_migrate
          APP_ENV: development
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE salon_migrate"
          alembic upgrade head
      - run: pytest -q
